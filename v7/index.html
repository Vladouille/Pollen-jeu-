<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9d2a8">
<title>POLLEN lavande</title>
<!--
  POLLEN v7 : une seule scène, belle et jouable.
  Un champ carré de 60 m pavé de tuiles hexagonales de 2 m (une touffe de lavande par tuile),
  moitié fanée, moitié en fleurs. On vise une tuile fanée, on maintient l'action deux secondes,
  elle fleurit. Un seul fichier pour l'ordinateur et le téléphone : l'appareil est détecté au
  chargement (?mode=pc ou ?mode=mobile pour forcer, ?debug pour les compteurs).
-->
<style>
  /* Une seule ambiance (champ au soleil bas) : couleurs fixées, pas de thème sombre. */
  :root { --encre: #fffaf0; --or: #ffd36a; --voile: rgba(36, 26, 48, .22); --trait: rgba(255, 250, 240, .72); --fond: #e9d2a8; --nuit: #3a2c4a; color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); overscroll-behavior: none; }
  body { color: var(--encre); font: 600 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #jeu { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; }
  #c { display: block; width: 100%; height: 100%; outline: none; cursor: crosshair; }
  #viseur { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--encre); box-shadow: 0 0 0 1.5px rgba(40, 28, 56, .35); pointer-events: none; opacity: .85; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid var(--trait); background: var(--voile); pointer-events: none; }
  .stick b { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 250, 240, .8); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  #agir { position: absolute; right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; padding: 0; border-radius: 50%; border: 2.5px solid var(--trait); background: var(--voile); display: grid; place-items: center; touch-action: none; transition: border-color .15s, box-shadow .15s, transform .08s; }
  #agir svg { width: 44px; height: 44px; }
  #agir.pret { border-color: var(--or); box-shadow: 0 0 0 3px rgba(255, 211, 106, .25), 0 0 22px rgba(255, 211, 106, .45); }
  #agir.appui { transform: scale(.92); background: rgba(255, 211, 106, .28); }
  #agir:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  #debug { position: absolute; left: 10px; top: 10px; margin: 0; padding: 6px 9px; border-radius: 6px; background: rgba(0, 0, 0, .45); font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #panne { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9; padding: 10px 14px; border-radius: 8px; background: rgba(58, 44, 74, .92); color: var(--encre); font: 600 13px/1.4 system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { #agir { transition: none; } }
</style>
<script>
  // Si quelque chose casse (navigateur trop ancien, réseau coupé), on l'écrit à l'écran plutôt que de rester muet.
  function panne(msg) { var p = document.getElementById('panne'); if (!p) return; p.hidden = false; p.textContent = msg; }
  window.addEventListener('error', function (e) { panne('Erreur : ' + (e.message || e.type)); });
  window.addEventListener('unhandledrejection', function (e) { panne('Erreur : ' + (e.reason && e.reason.message || e.reason)); });
  // Le moteur 3D vient d'un CDN : s'il n'est pas là au bout de vingt secondes, on le dit (et on se tait s'il finit par arriver).
  setTimeout(function () { if (!window.pollen) panne('Le moteur 3D ne se charge pas : vérifie la connexion, puis recharge la page.'); }, 20000);
</script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }

<body>
<div id="jeu">
  <canvas id="c" tabindex="0" aria-label="Champ de lavande à polliniser"></canvas>
  <div id="viseur"></div>
  <div class="stick" hidden><b></b></div>
  <button id="agir" type="button" hidden aria-label="Polliniser">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 38 L34 12" stroke="#fffaf0" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="36.5" cy="9.5" rx="5" ry="7" transform="rotate(40 36.5 9.5)" fill="#ffd36a"/><ellipse cx="9.5" cy="40.5" rx="4" ry="5.6" transform="rotate(40 9.5 40.5)" fill="#fffaf0"/></svg>
  </button>
  <pre id="debug" hidden></pre>
</div>
<div id="panne" hidden></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// 1. Appareil et qualité. Détection au chargement : écran tactile à pointeur
//    grossier, ou navigateur de téléphone. Le reste du code est commun.
// =====================================================================
const params = new URLSearchParams(location.search);
const MOBILE = params.has('mode') ? params.get('mode') === 'mobile'
  : (matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
// lod0 : rayon (m) des touffes en pleine définition ; lod1 : rayon des touffes simplifiées ;
// au-delà, chaque brin est une carte de 8 triangles face caméra et le sol prend la couleur de la touffe.
const Q = MOBILE
  ? { nom: 'mobile', dpr: 1.5, msaa: 2, ombres: 1024, lod0: 2.4, lod1: 7, abeilles: 64, pollen: 700, vignette: false, recoitLod1: false, loinDensite: 0.5, terrain: 110 }
  : { nom: 'pc', dpr: 2, msaa: 4, ombres: 2048, lod0: 5, lod1: 13, abeilles: 120, pollen: 1800, vignette: true, recoitLod1: true, loinDensite: 1, terrain: 176 };
for (const k of ['lod0', 'lod1', 'msaa', 'dpr']) if (params.has(k)) Q[k] = +params.get(k);
Q.auto = params.get('auto') !== '0';   // baisse automatique de qualité sous 52 img/s
const DEBUG = params.has('debug');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mulberry = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

// Bruit de valeur, et sa version périodique (pour des textures qui se répètent sans couture).
const PERM = new Uint8Array(512), VAL = new Float32Array(256);
{ const R = mulberry(91); for (let i = 0; i < 256; i++) { PERM[i] = i; VAL[i] = R(); } for (let i = 255; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [PERM[i], PERM[j]] = [PERM[j], PERM[i]]; } for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i]; }
function vbruit(x, y, p = 256) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const v = (a, b) => VAL[PERM[((a % p) + p) % p + PERM[((b % p) + p) % p]]];
  const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
  return lerp(lerp(v(xi, yi), v(xi + 1, yi), u), lerp(v(xi, yi + 1), v(xi + 1, yi + 1), u), w);
}
const fbm = (x, y, o = 4, p = 256) => { let a = 0.5, f = 1, s = 0, n = 0; for (let k = 0; k < o; k++) { s += a * vbruit(x * f, y * f, Math.min(256, p * f)); n += a; a *= 0.5; f *= 2; } return s / n; };

// =====================================================================
// 2. Le champ : relief léger, tuiles hexagonales, frontière irrégulière
// =====================================================================
const DEMI = 30;   // demi-côté du champ (m)
function H(x, z) {
  const m = Math.max(Math.abs(x), Math.abs(z));
  return 0.7 * Math.sin(x * 0.072 + 0.6) * Math.cos(z * 0.058 - 0.4) + 0.32 * Math.sin((x * 0.6 + z * 0.8) * 0.13 + 1.3)
    + 0.12 * Math.sin(x * 0.27 - z * 0.21 + 2.0) + ss(DEMI + 4, DEMI + 80, m) * 6;
}
const H_GLSL = `float terrainH(vec2 p) { float m = max(abs(p.x), abs(p.y));
  return 0.7 * sin(p.x * 0.072 + 0.6) * cos(p.y * 0.058 - 0.4) + 0.32 * sin((p.x * 0.6 + p.y * 0.8) * 0.13 + 1.3)
    + 0.12 * sin(p.x * 0.27 - p.y * 0.21 + 2.0) + smoothstep(${DEMI + 4}.0, ${DEMI + 80}.0, m) * 6.0; }`;

// Tuiles « pointe en haut », coordonnées axiales. 2 m entre côtés opposés : rayon intérieur 1 m.
const SQ3 = Math.sqrt(3), HS = 2 / SQ3, OFF = 32, NTEX = 64;
const hexCenter = (q, r) => [HS * SQ3 * (q + r / 2), HS * 1.5 * r];
function toHex(x, z) {
  const qf = (SQ3 / 3 * x - z / 3) / HS, rf = (2 / 3 * z) / HS, yf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf); const y = Math.round(yf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), dy = Math.abs(y - yf);
  if (dq > dr && dq > dy) q = -r - y; else if (dy <= dr) r = -q - y;
  return [q, r];
}
const HEX_GLSL = `
const float HXS = ${HS.toFixed(7)};
vec2 hexOf(vec2 p) {
  float qf = (0.5773503 * p.x - 0.3333333 * p.y) / HXS, rf = (0.6666667 * p.y) / HXS;
  vec3 c = vec3(qf, -qf - rf, rf); vec3 rc = floor(c + 0.5); vec3 d = abs(rc - c);
  if (d.x > d.y && d.x > d.z) rc.x = -rc.y - rc.z; else if (d.y > d.z) rc.y = -rc.x - rc.z; else rc.z = -rc.x - rc.y;
  return vec2(rc.x, rc.z);
}
vec2 hexC(vec2 h) { return vec2(HXS * 1.7320508 * (h.x + 0.5 * h.y), HXS * 1.5 * h.y); }
float hexBord(vec2 d) { return max(abs(d.x), max(abs(0.5 * d.x + 0.8660254 * d.y), abs(-0.5 * d.x + 0.8660254 * d.y))); }
vec4 etatTuile(vec2 h) { ivec2 c = ivec2(h) + ${OFF}; if (c.x < 0 || c.y < 0 || c.x >= ${NTEX} || c.y >= ${NTEX}) return vec4(0.0); return texelFetch(uState, c, 0); }`;

// La frontière entre fané et fleuri : une ligne qui serpente au milieu du champ.
const frontiere = (x, z) => x * 0.84 + z * 0.54 + 3.0 * Math.sin(z * 0.16 + 0.8) + 2.1 * Math.sin(x * 0.21 - 0.5) + 1.1 * Math.sin((x - z) * 0.37);

// Les tuiles sont des entrées de tableaux. t0 : instant de floraison (-1000 : fleurie au départ, 1e6 : fanée).
const T = { q: [], r: [], x: [], z: [], y: [], bloom: [], t0: [], joueur: [] };
const tileIdx = new Int32Array(NTEX * NTEX).fill(-1);
const idxOf = (q, r) => (q < -OFF || q >= OFF || r < -OFF || r >= OFF) ? -1 : tileIdx[(r + OFF) * NTEX + (q + OFF)];
for (let r = -OFF; r < OFF; r++) for (let q = -OFF; q < OFF; q++) {
  const [x, z] = hexCenter(q, r);
  if (Math.abs(x) > DEMI - 0.9 || Math.abs(z) > DEMI - 0.9) continue;
  tileIdx[(r + OFF) * NTEX + (q + OFF)] = T.q.length;
  const b = frontiere(x, z) > 0 ? 1 : 0;
  T.q.push(q); T.r.push(r); T.x.push(x); T.z.push(z); T.y.push(H(x, z)); T.bloom.push(b); T.t0.push(b ? -1000 : 1e6); T.joueur.push(0);
}
const NT = T.q.length;
// État lu par les shaders (texture flottante 64×64) : R instant de floraison, G pollinisée par le joueur,
// B dessinée de près (LOD 0 ou 1), A tuile existante.
const etat = new Float32Array(NTEX * NTEX * 4);
const etatTex = new THREE.DataTexture(etat, NTEX, NTEX, THREE.RGBAFormat, THREE.FloatType);
etatTex.magFilter = etatTex.minFilter = THREE.NearestFilter;
const texel = (i) => ((T.r[i] + OFF) * NTEX + (T.q[i] + OFF)) * 4;
function ecrireTuile(i) { const k = texel(i); etat[k] = T.t0[i]; etat[k + 1] = T.joueur[i]; etat[k + 3] = 1; }
for (let i = 0; i < NT; i++) ecrireTuile(i);
etatTex.needsUpdate = true;

// Départ : côté fleuri, dans l'allée entre deux touffes, le regard en biais vers le côté fané,
// une tuile fanée sous le viseur à quatre mètres.
const DEPART = (() => {
  let best = null;
  for (let gx = -9; gx <= 9; gx += 0.5) for (let gz = -9; gz <= 9; gz += 0.5) {
    const [q, r] = toHex(gx, gz), i = idxOf(q, r);
    if (i < 0 || !T.bloom[i] || Math.hypot(gx - T.x[i], gz - T.z[i]) < 0.85) continue;
    const f = frontiere(gx, gz); if (f < 1.2 || f > 3.4) continue;
    for (let a = 0; a < 36; a++) {
      const yaw = a / 36 * Math.PI * 2, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      const tx = gx + fx * 4.2, tz = gz + fz * 4.2, [tq, tr] = toHex(tx, tz), j = idxOf(tq, tr);
      if (j < 0 || T.bloom[j]) continue;
      const face = (fx * 0.84 + fz * 0.54) / Math.hypot(0.84, 0.54); // -1 : face au côté fané
      const score = Math.abs(face + 0.7) + Math.hypot(tx - T.x[j], tz - T.z[j]) * 0.35 + Math.hypot(gx, gz) * 0.02;
      const pitch = -Math.atan2(H(gx, gz) + 1.62 - H(tx, tz) - 0.3, 4.2);   // le viseur tombe sur la tuile fanée
      if (!best || score < best.score) best = { x: gx, z: gz, yaw, pitch, score };
    }
  }
  return best || { x: 4, z: 4, yaw: 0.9, pitch: -0.28 };
})();

// =====================================================================
// 3. Rendu, lumière, ciel, brume
// =====================================================================
const jeu = document.getElementById('jeu'), canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
let dpr = Math.min(window.devicePixelRatio || 1, Q.dpr);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xeccb9c);
scene.fog = new THREE.FogExp2(HORIZON, 0.0155);
const camera = new THREE.PerspectiveCamera(66, 16 / 9, 0.03, 900);
scene.add(camera);

// Soleil à 25°, placé en avant et sur le côté du regard de départ : contre-jour doux, ombres longues.
const SUN_EL = 25 * Math.PI / 180;
const SUN_DIR = (() => {
  const fx = -Math.sin(DEPART.yaw), fz = -Math.cos(DEPART.yaw), a = 1.05;
  const sx = fx * Math.cos(a) - fz * Math.sin(a), sz = fx * Math.sin(a) + fz * Math.cos(a);
  return new THREE.Vector3(sx * Math.cos(SUN_EL), Math.sin(SUN_EL), sz * Math.cos(SUN_EL)).normalize();
})();
const SOLEIL = new THREE.Color(0xffbf86);
const sun = new THREE.DirectionalLight(SOLEIL, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.ombres, Q.ombres);
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.012;
const zoneOmbre = () => Q.lod0 + 3;   // la carte d'ombres ne couvre que les touffes détaillées : plus nette
function cadrerOmbres() { const z = zoneOmbre(); Object.assign(sun.shadow.camera, { left: -z, right: z, top: z, bottom: -z, near: 0.5, far: 60 }); sun.shadow.camera.updateProjectionMatrix(); }
cadrerOmbres();
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd3ec, 0x8c7552, 0.6));   // ombres jamais noires

// Ciel : dégradé de trois couleurs sur une sphère retournée, soleil et halo.
const ciel = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uZen: { value: new THREE.Color(0x3f72bb) }, uMil: { value: new THREE.Color(0x93b8de) }, uHor: { value: HORIZON }, uSoleil: { value: SUN_DIR }, uSolC: { value: SOLEIL } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }',
  fragmentShader: `uniform vec3 uZen, uMil, uHor, uSoleil, uSolC; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 c = mix(uMil, uZen, smoothstep(0.1, 0.75, h));
      c = mix(uHor, c, smoothstep(0.0, 0.22, h));
      c = mix(c, uHor, smoothstep(0.0, -0.2, h));
      float s = max(dot(d, uSoleil), 0.0);
      c += uSolC * (pow(s, 900.0) * 7.0 + pow(s, 48.0) * 0.5 + pow(s, 6.0) * 0.3 * (1.0 - smoothstep(0.0, 0.6, h)));
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
ciel.frustumCulled = false; ciel.renderOrder = -10; scene.add(ciel);

// =====================================================================
// 4. Textures générées sur canvas : chaque matière a son bruit, et une carte
//    de normales tirée du même bruit. Aucune surface de couleur unie.
// =====================================================================
function texFrom(w, h, fn, srgb = true, repeat = 1) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = fn(x, y), i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function normalFrom(w, h, hf, k, repeat = 1) {
  const Hm = new Float32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) Hm[y * w + x] = hf(x, y);
  return texFrom(w, h, (x, y) => {
    const nx = (Hm[y * w + (x + w - 1) % w] - Hm[y * w + (x + 1) % w]) * k, ny = (Hm[((y + h - 1) % h) * w + x] - Hm[((y + 1) % h) * w + x]) * k, L = Math.hypot(nx, ny, 1);
    return [(nx / L * 0.5 + 0.5) * 255, (ny / L * 0.5 + 0.5) * 255, (1 / L * 0.5 + 0.5) * 255];
  }, false, repeat);
}

// =====================================================================
// 5. Le sol : relief, couleur peinte par sommet, texture de terre et normales.
//    Le shader y ajoute l'état de chaque tuile, l'ombre des touffes lointaines,
//    le surlignage de la tuile visée, et la brume au-delà du champ.
// =====================================================================
const U = {   // uniformes partagés par tous les matériaux du champ
  uTime: { value: 0 }, uState: { value: etatTex }, uSel: { value: new THREE.Vector3(0, 0, 0) }, uPulse: { value: 0 },
  uCam: { value: new THREE.Vector3() }, uCamR: { value: new THREE.Vector3(1, 0, 0) }, uWind: { value: new THREE.Vector2(0.8, 0.6).normalize() },
  uPlayer: { value: new THREE.Vector3(0, 0, 0) }, uSunV: { value: new THREE.Vector3() }, uSunW: { value: SUN_DIR },
  uSunC: { value: SOLEIL.clone().multiplyScalar(2.5) }, uLoin: { value: new THREE.Vector2(Q.lod1 * 0.8, Q.lod1 * 1.6) },
  uOmbreReelle: { value: Q.lod0 },
};
const TER = 220;
const terreH = (x, y) => fbm(x / 32, y / 32, 4, 8) * 0.55 + ss(0.7, 0.8, vbruit(x / 6.4, y / 6.4, 40)) * 0.5 + vbruit(x / 2, y / 2, 128) * 0.12;
const REP_SOL = TER / 2.6;   // un motif de texture tous les 2,6 m
const terreTex = texFrom(256, 256, (x, y) => {
  const m = fbm(x / 32, y / 32, 4, 8), c = ss(0.7, 0.8, vbruit(x / 6.4, y / 6.4, 40)), g = vbruit(x / 2, y / 2, 128);
  const v = 0.82 + 0.18 * m + 0.08 * (g - 0.5) + (Math.random() - 0.5) * 0.04;
  return [lerp(242 * v, 236, c * 0.4), lerp(232 * v, 230, c * 0.4), lerp(216 * v, 220, c * 0.4)];
}, true, REP_SOL);
const terreNormales = normalFrom(256, 256, terreH, 1.1, REP_SOL);
{

  T.bloom[i] = 1; T.t0[i] = gt; T.joueur[i] = 1; ecrireTuile(i); etatTex.needsUpdate = true;
  pollinisees++;
  recentes.unshift(i); if (recentes.length > 30) recentes.pop();
  affecterAbeilles(joueur.x, joueur.z);   // trois abeilles arrivent
  bouffees.emettre(i, gt);
  son.pollinise();
}
function polliniser(dt) {
  cible = viser();
  const fanee = cible >= 0 && !T.bloom[cible];
  if (E.action && fanee) {
    if (jauge.tuile !== cible) { jauge.tuile = cible; jauge.p = 0; }
    jauge.p += dt / 2;   // deux secondes
    if (jauge.p >= 1) { jauge.fin = gt; jauge.finTuile = cible; jauge.p = 0; jauge.tuile = -1; fleurir(cible); }
  } else { jauge.p = 0; jauge.tuile = -1; }   // relâcher (ou viser ailleurs) annule et vide la jauge
  if (jauge.tuile >= 0) jauge.dern = jauge.tuile;
  jauge.vue = jauge.p >= jauge.vue ? jauge.p : Math.max(jauge.p, jauge.vue - dt * 4);
  const eclat = clamp(1 - (gt - jauge.fin) / 0.35, 0, 1);
  const iA = jauge.tuile >= 0 ? jauge.tuile : eclat > 0 ? jauge.finTuile : jauge.vue > 0.001 ? jauge.dern : -1;
  jaugeMesh.visible = iA >= 0;
  if (iA >= 0) {
    jaugeMesh.position.set(T.x[iA], T.y[iA] + 0.95, T.z[iA]); jaugeMesh.quaternion.copy(camera.quaternion);
    const sc = 0.36 * (1 + eclat * 0.3); jaugeMesh.scale.set(sc, sc, sc);
    jaugeMat.uniforms.uP.value = eclat > 0 ? 1 : jauge.vue; jaugeMat.uniforms.uFlash.value = eclat; jaugeMat.uniforms.uA.value = eclat > 0 ? eclat : 1;
  }
  // Surlignage : franc sur une tuile fanée, discret sur une tuile déjà fleurie.
  if (cible >= 0) { if (U.uSel.value.x !== T.q[cible] || U.uSel.value.y !== T.r[cible]) { U.uSel.value.x = T.q[cible]; U.uSel.value.y = T.r[cible]; cibleSel = 0; } cibleSel = Math.min(1, cibleSel + dt * 8); }
  else cibleSel = Math.max(0, cibleSel - dt * 8);
  U.uSel.value.z = cibleSel * (fanee ? 1 : 0.45);
  bouton.classList.toggle('pret', fanee);
}
// Les mains : respiration à l'arrêt, balancier à contretemps en marchant ; en pollinisant, la droite
// avance et tamponne en petits cercles, la tête de coton se dore, puis un petit coup sec à la fin.
let geste = 0;
const cotonBlanc = new THREE.Color(0xf3e2b0), cotonDore = new THREE.Color(0xf0b52c);
function majMains(dt) {
  const a = clamp(joueur.vitesse / VIT, 0, 1.4), sb = Math.sin(joueur.pas), cb = Math.abs(Math.cos(joueur.pas));
  const souffle = Math.sin(gt * 1.4) * 0.004, souffle2 = Math.sin(gt * 1.4 + 1.1) * 0.004;
  geste = lerp(geste, E.action ? 1 : 0, 1 - Math.exp(-dt * 10));
  const charge = jauge.tuile >= 0 ? 1 : 0.35, w = gt * 9;
  const rondX = Math.cos(w) * 0.01 * geste * charge, rondY = Math.sin(w) * 0.007 * geste * charge;
  const fl = clamp(1 - (gt - jauge.fin) / 0.35, 0, 1), coup = Math.sin(fl * Math.PI) * 0.03;
  mainD.position.set(POSE_D.x + sb * 0.014 * a - retardRegard * 0.3 - 0.03 * geste + rondX, POSE_D.y - cb * 0.012 * a + souffle + retardRegardV * 0.25 + 0.012 * geste + rondY + coup, POSE_D.z - 0.045 * geste);
  mainD.rotation.set(POSE_D.rx + sb * 0.04 * a + 0.1 * geste - coup * 3, POSE_D.ry + retardRegard + 0.12 * geste, -retardRegard * 0.5);
  mainG.position.set(POSE_G.x - sb * 0.012 * a - retardRegard * 0.3, POSE_G.y - (1 - cb) * 0.012 * a + souffle2 + retardRegardV * 0.25, POSE_G.z);
  mainG.rotation.set(POSE_G.rx - sb * 0.04 * a, POSE_G.ry + retardRegard, -retardRegard * 0.5);
  cotonTete.color.copy(cotonBlanc).lerp(cotonDore, Math.max(jauge.vue, fl) * 0.8);
  cotonTete.emissive.copy(cotonDore).multiplyScalar(jauge.vue * 0.25);
}

// =====================================================================
// 14. Post-traitement : bloom léger ; sur ordinateur, une vignette discrète.
// =====================================================================
const flottant = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const cibleRendu = new THREE.WebGLRenderTarget(1, 1, { type: flottant ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: Q.msaa });
const composer = new EffectComposer(renderer, cibleRendu);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), MOBILE ? 0.2 : 0.24, 0.4, 0.9);
composer.addPass(bloom);
if (Q.vignette) composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec2 c = vUv - 0.5; vec3 col = texture2D(tDiffuse, vUv).rgb; col *= 1.0 - smoothstep(0.2, 0.75, dot(c, c) * 1.3) * 0.26; gl_FragColor = vec4(col, 1.0); }',
}));
composer.addPass(new OutputPass());
function disposer() {
  tourne = MOBILE && innerHeight > innerWidth;
  const W = tourne ? innerHeight : innerWidth, Hh = tourne ? innerWidth : innerHeight;
  jeu.style.width = W + 'px'; jeu.style.height = Hh + 'px';
  jeu.style.transform = tourne ? `translate(${innerWidth}px, 0) rotate(90deg)` : 'none';
  renderer.setPixelRatio(dpr); renderer.setSize(W, Hh, false);
  composer.setPixelRatio(dpr); composer.setSize(W, Hh);
  camera.aspect = W / Hh;
  camera.fov = clamp(2 * Math.atan(Math.tan(50 * Math.PI / 180) / camera.aspect) * 180 / Math.PI, 52, 72);   // environ 100° à l'horizontale
  camera.updateProjectionMatrix();
  grains.uniforms.uTaille.value = 0.014 * Hh * dpr / (2 * Math.tan(camera.fov * Math.PI / 360));   // grain d'environ 1,4 cm (lumineux)
}
disposer();
addEventListener('resize', disposer);
addEventListener('orientationchange', () => setTimeout(disposer, 250));

// =====================================================================
// 15. La boucle, la qualité automatique, et une petite interface pour les tests
// =====================================================================
function majOmbres() {   // la carte d'ombres suit le joueur, calée sur sa grille pour ne pas scintiller
  const z = zoneOmbre(), st = (z * 2) / Q.ombres, sx = Math.round(joueur.x / st) * st, sz = Math.round(joueur.z / st) * st, sy = H(sx, sz);
  sun.target.position.set(sx, sy, sz); sun.position.set(sx + SUN_DIR.x * 30, sy + SUN_DIR.y * 30, sz + SUN_DIR.z * 30);
  sun.target.updateMatrixWorld();
}
let tAbeilles = 0;
function majMonde(dt) {
  gt += dt; U.uTime.value = gt;
  majJoueur(dt); majCamera(); polliniser(dt); majMains(dt);
  if (Math.hypot(joueur.x - centreLod.x, joueur.z - centreLod.z) > 1) reconstruire(joueur.x, joueur.z);
  if ((tAbeilles -= dt) <= 0) { tAbeilles = 0.6; affecterAbeilles(joueur.x, joueur.z); }
  majAbeilles();
  U.uPlayer.value.set(joueur.x, joueur.z, 1);
  U.uCam.value.copy(camera.position);
  U.uCamR.value.set(Math.cos(joueur.yaw), 0, -Math.sin(joueur.yaw));
  U.uSunV.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  U.uPulse.value = 0.5 + 0.5 * Math.sin(gt * 5);
  grains.uniforms.uCentre.value.set(joueur.x, joueur.z);
  majOmbres();
  ciel.position.copy(camera.position);
}
let fps = 60, accF = 0, nF = 0, controles = 0;
function qualiteAuto(raw) {   // sous 52 img/s : résolution, puis rayons de détail, puis bloom
  if (raw > 0.5) return;
  accF += raw; nF++;
  if (accF < 2) return;
  fps = nF / accF; accF = 0; nF = 0; controles++;
  if (!Q.auto || controles < 3 || fps >= 52) return;
  if (dpr > 1.01) { dpr = Math.max(1, dpr - 0.25); disposer(); }
  else if (Q.lod1 > 6.01) {
    Q.lod0 = Math.max(1.6, Q.lod0 * 0.8); Q.lod1 = Math.max(6, Q.lod1 * 0.8);
    U.uLoin.value.set(Q.lod1 * 0.8, Q.lod1 * 1.6); U.uOmbreReelle.value = Q.lod0; cadrerOmbres(); reconstruire(joueur.x, joueur.z);
  } else if (bloom.enabled) bloom.enabled = false;
}
const dbg = document.getElementById('debug');
if (DEBUG) dbg.hidden = false;
let dernier = performance.now();
function image(now) {
  requestAnimationFrame(image);   // en premier : une erreur dans une image n'arrête pas la boucle
  const raw = (now - dernier) / 1000; dernier = now;
  qualiteAuto(raw);
  if (!window.pollen.figer) majMonde(Math.min(0.05, Math.max(0, raw)));   // figer : réservé aux captures des tests
  renderer.info.reset();
  composer.render();
  if (DEBUG) dbg.textContent = `${Q.nom} · ${fps.toFixed(0)} img/s · ratio ${dpr}\ntriangles ${(renderer.info.render.triangles / 1000).toFixed(0)} k · appels ${renderer.info.render.calls}\ndétail ${Q.lod0.toFixed(1)} / ${Q.lod1.toFixed(1)} m · tuile visée ${cible}\njoueur ${joueur.x.toFixed(1)} ${joueur.z.toFixed(1)}`;
}
window.pollen = {
  figer: false,
  Q, T, H, toHex, idxOf, hexCenter, joueur, E, camera, scene, renderer, composer, jauge, abeilles, son, U, DEPART, SUN_DIR, LOD, LOIN, mainD, mainG,
  VARIANTES, viser, fleurir, abeillesSur, reconstruire,
  brinsTuile: (i) => { let n = 0; for (let v = 0; v < NV; v++) n += blocs[(i * NV + v) * 2 + 1]; return n; },
  get cible() { return cible; }, get gt() { return gt; },
  // Avance la simulation sans attendre l'affichage (le rendu logiciel des tests tourne à 1 img/s).
  step(dt, n = 1) { for (let k = 0; k < n; k++) majMonde(dt); return { x: joueur.x, z: joueur.z, y: joueur.y, yaw: joueur.yaw, pitch: joueur.pitch, vitesse: joueur.vitesse, cible, jauge: jauge.p }; },
  stats() {
    let lod0 = 0, lod1 = 0; LOD[0].forEach((o) => { lod0 += o.m.count; }); LOD[1].forEach((o) => { lod1 += o.m.count; });
    return { tuiles: NT, fleuries: T.bloom.reduce((s, b) => s + b, 0), brins: totalBrins, lod0, lod1, loin: LOIN.m.count, triangles: renderer.info.render.triangles, appels: renderer.info.render.calls, sons: son.n, pollinisees, abeilles: beeCorps.count };
  },
  fps: () => fps,
};

// Départ : touffes proches détaillées, abeilles déjà en place, première image.
reconstruire(joueur.x, joueur.z);
affecterAbeilles(joueur.x, joueur.z); for (const b of abeilles) b.arr = -10;
majMonde(0);
requestAnimationFrame(image);
if (document.getElementById('panne').textContent.startsWith('Le moteur 3D')) document.getElementById('panne').hidden = true;
</script>
</body>
