<style>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #86b6e4; overscroll-behavior: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px var(--shade); }

  #credits {

  #banner.show { animation: banner 2.8s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

  #bar {
    position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);

  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,250,240,.55); background: rgba(30,26,16,.18); }
  .stick b { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,250,240,.75); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #act {
    position: absolute; pointer-events: auto; border: 0; touch-action: none;
    right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(140px + env(safe-area-inset-bottom, 0px));

<script type="module">
import * as THREE from 'three';

// =====================================================================
// POLLEN v3 : un seul fichier. Végétation organique (troncs en tubes
// courbes, branches récursives, feuillage en plans croisés), aucune
// boîte dans la scène, guidage par l'image, début volontairement lent.
// =====================================================================

const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');
const SPEED = Number(params.get('vitesse')) || 1;
const SCENE = params.get('scene') || 'jeu'; // 'arbre' : un seul arbre (étape 1 du brief)
const SAVE_KEY = 'pollen-v3';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rng = mulberry32(73);
const rand = (a, b) => a + (b - a) * rng();

// ---------- Réglages de jeu (le début est lent exprès) ----------
const TUNING = {
  walk: 3.4, run: 6.2, heavy: 0.7,            // vitesse ; panier plein : −30 %
  staminaRun: 12, staminaRefill: 20,           // secondes
  bloom: 90,                                   // une fleur ouverte non pollinisée disparaît au bout de 90 s
  grow: 60,                                    // de la fleur au fruit mûr
  spoil: 120, fresh: 4, stale: 2,              // valeur d'un fruit, frais ou abîmé (après 2 min dans le panier)
  reach: 2.6,
};
const TOOLS = [
  { name: 'Tige de coton', doses: 1, basket: 6, price: 0 },
  { name: 'Pinceau', doses: 8, basket: 20, price: 250 },
];

// ---------- Relief : bruit fractal (somme d'ondes tournées), même code en JS et GLSL ----------
const FARM = { x: 4, z: -16 };
function H(x, z) {
  let h = 0, a = 1.0, f = 0.034, px = x, pz = z;
  for (let o = 0; o < 5; o++) {
    h += a * Math.sin(px * f) * Math.cos(pz * f * 1.13 + o * 1.7);
    const nx = px * 0.8 - pz * 0.6, nz = px * 0.6 + pz * 0.8;
    px = nx + 17.3; pz = nz - 9.1; f *= 1.93; a *= 0.48;
  }
  const dx = x - FARM.x, dz = z - FARM.z, r = Math.hypot(dx, dz);
  const hills = ss(70, 230, r) * (22 + 12 * Math.sin(Math.atan2(dz, dx) * 3 + 1));
  return h * (0.85 + 2.6 * ss(45, 140, r)) + hills;
}
const HEIGHT_GLSL = /* glsl */`
float terrainH(vec2 p) {
  float h = 0.0, a = 1.0, f = 0.034; vec2 q = p;
  for (int o = 0; o < 5; o++) {
    h += a * sin(q.x * f) * cos(q.y * f * 1.13 + float(o) * 1.7);
    q = vec2(q.x * 0.8 - q.y * 0.6 + 17.3, q.x * 0.6 + q.y * 0.8 - 9.1);
    f *= 1.93; a *= 0.48;
  }
  vec2 d = p - vec2(${FARM.x.toFixed(1)}, ${FARM.z.toFixed(1)});
  float r = length(d);
  float hills = smoothstep(70.0, 230.0, r) * (22.0 + 12.0 * sin(atan(d.y, d.x) * 3.0 + 1.0));
  return h * (0.85 + 2.6 * smoothstep(45.0, 140.0, r)) + hills;
}`;
function groundNormal(x, z, out = new THREE.Vector3()) {
  const e = 0.4;
  return out.set(H(x - e, z) - H(x + e, z), 2 * e, H(x, z - e) - H(x, z + e)).normalize();
}

// ---------- Lieux ----------
const SPAWN = { x: 0, z: 0 };
const MARKET = { x: 40, z: -34 };              // ≈ 50 m du verger, visible depuis le départ
const BENCH = { x: 35.5, z: -30.5 };            // l'établi, à côté de la charrette

// =====================================================================
// Rendu
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfe3f2, 0.011);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 1400);

const sun = new THREE.DirectionalLight(0xfff1dc, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 160 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xa8d0f0, 0x5d5a32, 0.6);
const ambient = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(hemi, ambient);

// ---------- Textures générées en code ----------
function valueNoise(seed) {
  const r = mulberry32(seed), N = 256, perm = new Uint8Array(512), val = new Float32Array(N);
  for (let i = 0; i < N; i++) { perm[i] = i; val[i] = r(); }
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < N; i++) perm[i + N] = perm[i];
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y, period = 256) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const w = (v) => ((v % period) + period) % period & 255;
    const X0 = w(xi), X1 = w(xi + 1), Y0 = w(yi), Y1 = w(yi + 1);
    const v = (a, b) => val[perm[a + perm[b]]];
    const u = s(xf), q = s(yf);
    return lerp(lerp(v(X0, Y0), v(X1, Y0), u), lerp(v(X0, Y1), v(X1, Y1), u), q);
  };
}
const noiseA = valueNoise(7);
function fbm(x, y, oct = 4, period = 256) {
  let a = 0.5, f = 1, s = 0, n = 0;
  for (let o = 0; o < oct; o++) { s += a * noiseA(x * f, y * f, period * f); n += a; a *= 0.5; f *= 2; }
  return s / n;
}
function canvasTex(size, paint, { repeat = 1, srgb = true, w = size, h = size } = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  paint(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function pixels(g, w, h, fn) {
  const img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = fn(x, y), i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3] ?? 255; }
  g.putImageData(img, 0, 0);
}
const grainTex = canvasTex(256, (g, w, h) => pixels(g, w, h, (x, y) => { const v = (0.74 + 0.26 * fbm(x / 22, y / 22, 4, w / 22) + (Math.random() - 0.5) * 0.12) * 255; return [v, v * 0.98, v * 0.94]; }), { repeat: 90 });
// Écorce : stries verticales et nœuds.
const barkTex = canvasTex(128, (g, w, h) => pixels(g, w, h, (x, y) => {
  const v = 0.55 + 0.35 * fbm(x / 2.5, y / 26, 3, 64) + 0.12 * Math.sin(x * 0.9 + fbm(x / 6, y / 12, 2, 32) * 6) + (Math.random() - 0.5) * 0.08;
  return [158 * v, 128 * v, 100 * v];
}));
barkTex.repeat.set(2, 3);
// Bois veiné.
function woodTex(base, seed = 1) {
  return canvasTex(128, (g, w, h) => pixels(g, w, h, (x, y) => {
    const v = 0.8 + 0.2 * Math.sin(y * 0.32 + fbm(x / 9 + seed, y / 40, 3, 64) * 9) * 0.5 + 0.12 * fbm(x / 4, y / 24, 2, 64) + (Math.random() - 0.5) * 0.06;
    return [base[0] * v, base[1] * v, base[2] * v];
  }));
}
const woodWarm = woodTex([164, 116, 72], 1);
const woodGrey = woodTex([172, 154, 130], 3);
const woodDark = woodTex([112, 78, 50], 5);
// Touffe de feuilles sur fond transparent, découpée par alphaTest.
const leafTex = canvasTex(256, (g, w) => {
  g.clearRect(0, 0, w, w);
  const R = mulberry32(11);
  for (let k = 0; k < 150; k++) {
    const a = R() * Math.PI * 2, d = Math.pow(R(), 0.6) * w * 0.4;
    const x = w / 2 + Math.cos(a) * d, y = w / 2 + Math.sin(a) * d * 0.95;
    const L = (14 + R() * 12) * (1 - d / (w * 0.6)) + 6;
    const ang = a + (R() - 0.5) * 1.6;
    const shade = 0.7 + 0.3 * R();
    g.save(); g.translate(x, y); g.rotate(ang);
    const gr = g.createLinearGradient(-L, 0, L, 0);
    gr.addColorStop(0, `rgb(${100 * shade},${158 * shade},${58 * shade})`);
    gr.addColorStop(1, `rgb(${165 * shade},${212 * shade},${96 * shade})`);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 0, L, L * 0.42, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = `rgba(40,70,20,${0.35 * shade})`; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(-L * 0.9, 0); g.lineTo(L * 0.9, 0); g.stroke();
    g.restore();
  }
}, { repeat: 1 });
leafTex.wrapS = leafTex.wrapT = THREE.ClampToEdgeWrapping;
// Toile rayée, osier, combinaison froissée.
const stripeTex = canvasTex(128, (g, w, h) => pixels(g, w, h, (x, y) => { const red = Math.floor(x / 16) % 2 === 0, v = 0.9 + 0.1 * fbm(x / 6, y / 6, 2, 64); return red ? [196 * v, 62 * v, 52 * v] : [246 * v, 238 * v, 216 * v]; }));
const wickerTex = canvasTex(64, (g, w, h) => pixels(g, w, h, (x, y) => { const v = 0.7 + 0.3 * Math.abs(Math.sin((x + (Math.floor(y / 6) % 2) * 6) * 0.52)) * (0.7 + 0.3 * Math.sin(y * 1.05)) + (Math.random() - 0.5) * 0.08; return [200 * v, 152 * v, 90 * v]; }));
wickerTex.repeat.set(4, 2);
const suitTex = canvasTex(128, (g, w, h) => pixels(g, w, h, (x, y) => { const v = 0.86 + 0.1 * fbm(x / 7, y / 18, 3, 64) + 0.06 * Math.sin(x * 0.22 + fbm(x / 9, y / 9, 2, 64) * 5) + (Math.random() - 0.5) * 0.03; return [246 * v, 244 * v, 236 * v]; }));
const strawTex = canvasTex(64, (g, w, h) => pixels(g, w, h, (x, y) => { const v = 0.78 + 0.22 * Math.sin((x + y) * 1.1) * Math.sin((x - y) * 1.1) + (Math.random() - 0.5) * 0.1; return [232 * v, 200 * v, 128 * v]; }));
const metalTex = canvasTex(64, (g, w, h) => pixels(g, w, h, (x, y) => { const v = (0.75 + 0.25 * fbm(x / 5, y / 5, 3, 32) + (Math.random() - 0.5) * 0.1) * 210; return [v, v, v * 1.02]; }));
const softDot = canvasTex(64, (g, w) => { const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });
softDot.wrapS = softDot.wrapT = THREE.ClampToEdgeWrapping;
const blobTex = canvasTex(64, (g, w) => { const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); gr.addColorStop(0, 'rgb(140,140,140)'); gr.addColorStop(0.55, 'rgb(70,70,70)'); gr.addColorStop(1, 'rgb(0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); }, { srgb: false });
blobTex.wrapS = blobTex.wrapT = THREE.ClampToEdgeWrapping;
const cloudTex = canvasTex(256, (g, w, h) => pixels(g, w, h, (x, y) => {
  const dx = (x - w / 2) / (w / 2), dy = (y - h / 2) / (h / 2);
  const fall = clamp(1 - Math.hypot(dx, dy * 1.6), 0, 1);
  const a = clamp((fbm(x / 28, y / 28, 5, w / 28) * 1.3 - 0.45) * 2.6, 0, 1) * fall * fall;
  const s = 215 + 20 * clamp(1 - dy, 0, 1);
  return [s, s, s + 6, a * 255];
}));
cloudTex.wrapS = cloudTex.wrapT = THREE.ClampToEdgeWrapping;
const handTex = canvasTex(128, (g, w) => {
  g.clearRect(0, 0, w, w);
  g.translate(w / 2, w / 2 + 6);

// Génère un arbre : renvoie sa géométrie de bois (fusionnée), ses touffes et ses bouts de rameaux.
function growTree(R, opt) {

  const tp = [V(0, -0.15, 0), V((R() - 0.5) * 0.25, height * 0.35, (R() - 0.5) * 0.25), V((R() - 0.5) * 0.35, height * 0.7, (R() - 0.5) * 0.35), V((R() - 0.5) * 0.3, height, (R() - 0.5) * 0.3)].map((v) => v.applyQuaternion(tq));

    const mid = start.clone().addScaledVector(dir, len * 0.5).add(bend);
    const end = start.clone().addScaledVector(dir, len).addScaledVector(bend, 1.4);
    end.y -= len * len * 0.06 * (level >= 2 ? 1 : 0.5); // les rameaux ploient
    const curve = new THREE.CatmullRomCurve3([start, mid, end]);
    parts.push(taperTube(curve, level < 2 ? 7 : 4, level < 2 ? 7 : 5, rad, rad * 0.5));
    const tan = curve.getTangentAt(1);
    if (level >= 2 || level === levels) {

      leaves.push({ p: end.clone(), s: len * 1.4, tip: true });
      tips.push({ p: end.clone(), d: tan.clone() });
    }
    if (level >= levels) return;
    const n = kids[level] + (R() < 0.4 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const t = lerp(0.45, 1, (k + R() * 0.6) / n);
      const at = curve.getPointAt(Math.min(t, 1));
      const baseDir = curve.getTangentAt(Math.min(t, 1));
      const ang = THREE.MathUtils.degToRad(30 + R() * 20);
      const axis = V(0, 0, 1).applyAxisAngle(baseDir, R() * 6.28);
      const perp = new THREE.Vector3().crossVectors(baseDir, axis).normalize();

  const nMain = kids[0] + 1 + Math.floor(R() * 2);
  const az0 = R() * 6.283;
  for (let k = 0; k < nMain; k++) {
    const t = lerp(0.45, 0.92, k / Math.max(1, nMain - 1)) + (R() - 0.5) * 0.06;
    const at = trunkCurve.getPointAt(clamp(t, 0.3, 1));

    const elev = THREE.MathUtils.degToRad(lerp(30, 58, t) + R() * 8);

  }

  branch(trunkCurve.getPointAt(1), trunkCurve.getTangentAt(1).lerp(up, 0.5).normalize(), height * 0.28, r0 * 0.4, 2);
  return { geo: mergeGeos(parts), leaves, tips, height };
}

const audio = (() => {
  let ctx = null, master = null, n = 0;
  const PENTA = [0, 2, 4, 7, 9, 12, 14];
  function noise(sec) { const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    const src = ctx.createBufferSource(); src.buffer = noise(4); src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    const g = ctx.createGain(); g.gain.value = 0.045;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.08; lg.gain.value = 0.03;
    lfo.connect(lg).connect(g.gain); src.connect(f).connect(g).connect(master); src.start(); lfo.start();
  }
  function tone(fr, t, dur, type = 'sine', gain = 0.2, slide = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(fr, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(fr * slide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(t, dur, freq, gain) { const s = ctx.createBufferSource(); s.buffer = noise(dur + 0.1); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f).connect(g).connect(master); s.start(t); }
  const on = (fn) => (...a) => { if (ctx) fn(ctx.currentTime, ...a); };
  return {
    init,
    charge: on((t) => { hiss(t, 0.25, 3000, 0.1); tone(520, t, 0.18, 'triangle', 0.07, 1.5); }),
    pollinate: on((t) => { const s = PENTA[(n++ + Math.floor(Math.random() * 3)) % 7], f = 660 * 2 ** (s / 12); tone(f, t, 0.3, 'sine', 0.18); tone(f * 1.5, t + 0.08, 0.3, 'sine', 0.08); tone(f * 2, t + 0.16, 0.35, 'sine', 0.05); }),
    pick: on((t) => { tone(420, t, 0.08, 'triangle', 0.12, 1.6); hiss(t, 0.08, 1800, 0.05); }),
    coins: on((t) => { for (let k = 0; k < 6; k++) { tone(1800 + Math.random() * 900, t + k * 0.07, 0.12, 'triangle', 0.07); tone(2600 + Math.random() * 600, t + k * 0.07 + 0.02, 0.1, 'sine', 0.04); } }),
    buy: on((t) => { [0, 4, 7, 11, 12, 16, 19, 24].forEach((s, k) => tone(392 * 2 ** (s / 12), t + k * 0.08, 0.5, 'triangle', 0.13)); hiss(t + 0.1, 1.4, 600, 0.1); }),
    denied: on((t) => tone(180, t, 0.1, 'square', 0.035)),
    step: on((t, soft) => hiss(t, 0.06, 500 + Math.random() * 300, soft ? 0.02 : 0.03)),
    puff: on((t) => hiss(t, 0.3, 300, 0.04)),
  };
})();

// Ouverture guidée : une fleur, puis la suivante, puis des groupes de plus en plus larges.
const GROUPS = [1, 1, 2, 3, 5];
function openNear(n, x, z) {
  const cands = blossoms.map((b, i) => ({ b, i })).filter(({ b }) => b.kind === 'target' && b.state === BUD).sort((a, c) => Math.hypot(a.b.x - x, a.b.z - z) - Math.hypot(c.b.x - x, c.b.z - z));
  for (const { b } of cands.slice(0, n)) { b.state = OPEN; b.timer = TUNING.bloom; b.pop = 1; }
}
function initFlowers() {
  if (SCENE === 'arbre') { blossoms.forEach((b, i) => { if (b.kind === 'target') { b.state = i % 3 === 0 ? GROWING : OPEN; b.growth = rand(0.3, 1); b.timer = 999; } }); return; }
  if (state.guided >= GROUPS.length) {
    blossoms.forEach((b) => { if (b.kind === 'target') { b.state = rng() < 0.35 ? OPEN : BUD; b.timer = b.state === OPEN ? rand(40, TUNING.bloom) : rand(5, 40); } });
    return;
  }
  // Au départ : seules les fleurs du pommier isolé, une source et une fleur à polliniser.
  const first = blossoms.filter((b) => b.tree === 0 && b.kind === 'target');
  first.sort((a, b) => Math.hypot(a.x - SPAWN.x, a.z - SPAWN.z) - Math.hypot(b.x - SPAWN.x, b.z - SPAWN.z));
  if (first[0]) { first[0].state = OPEN; first[0].timer = 999; }
  blossoms.forEach((b) => { if (b.kind === 'target' && b.state === BUD) b.timer = 1e9; });
}
