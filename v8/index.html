<title>POLLEN</title>
<!--
  POLLEN v8 : de vrais modèles 3D (CC0) chargés depuis le dossier du jeu, et la boucle complète.
  Un champ de 80 m pavé de tuiles hexagonales de 2 m, moitié fané, moitié en lavande. On pollinise
  une tuile (la fleur va dans le panier), on vend au marché, on achète le pinceau à l'atelier.
  Fichiers attendus à côté de ce fichier (voir v8/LISEZMOI.md) :
    models/fleur_lavande.glb, models/marche.glb, models/atelier.glb,
    models/outil_coton.glb, models/outil_pinceau.glb, hdri/ciel.hdr
  Un fichier absent est remplacé par une forme de substitution, et un message dit lequel.
  Il faut ouvrir la page par un serveur (itch.io, Live Server, python -m http.server) :
  un double-clic sur le fichier bloque le chargement des modèles.
  Un seul fichier pour l'ordinateur et le téléphone (?mode=pc ou ?mode=mobile pour forcer, ?debug).
-->
<style>
  /* Une seule ambiance (champ au soleil bas) : couleurs fixées, pas de thème sombre. */
  :root { --encre: #fffaf0; --or: #ffd36a; --voile: rgba(36, 26, 48, .22); --trait: rgba(255, 250, 240, .72); --fond: #e9d2a8; --nuit: #3a2c4a; color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); overscroll-behavior: none; }
  body { color: var(--encre); font: 600 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #jeu { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; }
  #c { display: block; width: 100%; height: 100%; outline: none; cursor: crosshair; }
  #viseur { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--encre); box-shadow: 0 0 0 1.5px rgba(40, 28, 56, .35); pointer-events: none; opacity: .85; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid var(--trait); background: var(--voile); pointer-events: none; }
  .stick b { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 250, 240, .8); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  #agir { position: absolute; right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; padding: 0; border-radius: 50%; border: 2.5px solid var(--trait); background: var(--voile); display: grid; place-items: center; touch-action: none; transition: border-color .15s, box-shadow .15s, transform .08s; }
  #agir svg { width: 44px; height: 44px; }
  #agir.pret { border-color: var(--or); box-shadow: 0 0 0 3px rgba(255, 211, 106, .25), 0 0 22px rgba(255, 211, 106, .45); }
  #agir.appui { transform: scale(.92); background: rgba(255, 211, 106, .28); }
  #agir:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  #debug { position: absolute; left: 10px; top: 10px; margin: 0; padding: 6px 9px; border-radius: 6px; background: rgba(0, 0, 0, .45); font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #panne { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9; padding: 10px 14px; border-radius: 8px; background: rgba(58, 44, 74, .92); color: var(--encre); font: 600 13px/1.4 system-ui, sans-serif; }

  #panneau { position: absolute; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 4px; padding: 14px 20px; border-radius: 14px; background: rgba(36, 26, 48, .62); text-align: center; min-width: 260px; }
  #panneau strong { font: 800 19px/1.2 system-ui, sans-serif; }
  #panneau span { font: 600 14px/1.35 system-ui, sans-serif; }
  #pnPrix { color: var(--or); }
  #objectif { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 2px; pointer-events: none; }
  #objectif i { width: 16px; height: 16px; background: var(--or); transform: rotate(45deg); box-shadow: 0 0 10px rgba(255, 211, 106, .8); }
  #objectif span { font: 700 13px/1 system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  #chargement { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: linear-gradient(#93b8de, #eccb9c 70%); color: var(--nuit); padding: 24px; }
  #chargement .carte { width: min(420px, 100%); display: grid; gap: 12px; text-align: center; }
  #chargement h1 { margin: 0; font: 800 38px/1 Georgia, "Times New Roman", serif; letter-spacing: .12em; }
  #chargement .barre { height: 10px; border-radius: 5px; background: rgba(58, 44, 74, .18); overflow: hidden; }
  #chargement .barre i { display: block; height: 100%; width: 0; background: #6b4fb5; transition: width .2s; }
  #chargement p, #chargement li { margin: 0; font: 600 14px/1.4 system-ui, sans-serif; }
  #chErreurs { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; color: #8a2b1a; }
  #notice { position: absolute; left: 12px; top: 12px; max-width: min(560px, calc(100% - 140px)); display: grid; gap: 8px; padding: 10px 14px; border-radius: 10px; background: rgba(58, 44, 74, .86); font: 600 13px/1.4 system-ui, sans-serif; }
  #notice p { margin: 0; }
  #notice button { justify-self: start; padding: 5px 12px; border-radius: 6px; border: 0; background: var(--or); color: var(--nuit); font: 700 13px/1 system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { #agir, #chargement .barre i { transition: none; } }

<script>
  // Si quelque chose casse (navigateur trop ancien, réseau coupé), on l'écrit à l'écran plutôt que de rester muet.
  function panne(msg) { var p = document.getElementById('panne'); if (!p) return; p.hidden = false; p.textContent = msg; }
  window.addEventListener('error', function (e) { panne('Erreur : ' + (e.message || e.type)); });
  window.addEventListener('unhandledrejection', function (e) { panne('Erreur : ' + (e.reason && e.reason.message || e.reason)); });
  // Le moteur 3D vient d'un CDN : s'il n'est pas là au bout de vingt secondes, on le dit (et on se tait s'il finit par arriver).
  setTimeout(function () { if (!window.pollen) panne('Le moteur 3D ne se charge pas : vérifie la connexion, puis recharge la page.'); }, 20000);
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// =====================================================================
// 1. Appareil et qualité. Détection au chargement : écran tactile à pointeur
//    grossier, ou navigateur de téléphone. Le reste du code est commun.
// =====================================================================
const params = new URLSearchParams(location.search);
const MOBILE = params.has('mode') ? params.get('mode') === 'mobile'
  : (matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
// lod0 : rayon (m) des touffes en pleine définition ; lod1 : rayon des touffes simplifiées ;
// au-delà, chaque brin est une carte de 8 triangles face caméra et le sol prend la couleur de la touffe.
const Q = MOBILE
  ? { nom: 'mobile', dpr: 1.5, msaa: 2, ombres: 1024, lod0: 2.4, lod1: 7, abeilles: 64, pollen: 700, vignette: false, recoitLod1: false, loinDensite: 0.5, terrain: 110 }
  : { nom: 'pc', dpr: 2, msaa: 4, ombres: 2048, lod0: 5, lod1: 13, abeilles: 120, pollen: 1800, vignette: true, recoitLod1: true, loinDensite: 1, terrain: 176 };
for (const k of ['lod0', 'lod1', 'msaa', 'dpr']) if (params.has(k)) Q[k] = +params.get(k);
Q.auto = params.get('auto') !== '0';   // baisse automatique de qualité sous 52 img/s
const DEBUG = params.has('debug');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mulberry = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

// Bruit de valeur, et sa version périodique (pour des textures qui se répètent sans couture).
const PERM = new Uint8Array(512), VAL = new Float32Array(256);
{ const R = mulberry(91); for (let i = 0; i < 256; i++) { PERM[i] = i; VAL[i] = R(); } for (let i = 255; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [PERM[i], PERM[j]] = [PERM[j], PERM[i]]; } for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i]; }
function vbruit(x, y, p = 256) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const v = (a, b) => VAL[PERM[((a % p) + p) % p + PERM[((b % p) + p) % p]]];
  const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
  return lerp(lerp(v(xi, yi), v(xi + 1, yi), u), lerp(v(xi, yi + 1), v(xi + 1, yi + 1), u), w);
}
const fbm = (x, y, o = 4, p = 256) => { let a = 0.5, f = 1, s = 0, n = 0; for (let k = 0; k < o; k++) { s += a * vbruit(x * f, y * f, Math.min(256, p * f)); n += a; a *= 0.5; f *= 2; } return s / n; };

// =====================================================================
// 2. Le champ : relief léger, tuiles hexagonales, frontière irrégulière
// =====================================================================
const DEMI = 40;   // demi-côté du champ (m) : 80 m de côté
function H(x, z) {
  const m = Math.max(Math.abs(x), Math.abs(z));
  return 0.7 * Math.sin(x * 0.072 + 0.6) * Math.cos(z * 0.058 - 0.4) + 0.32 * Math.sin((x * 0.6 + z * 0.8) * 0.13 + 1.3)
    + 0.12 * Math.sin(x * 0.27 - z * 0.21 + 2.0) + ss(DEMI + 4, DEMI + 80, m) * 6;
}
const H_GLSL = `float terrainH(vec2 p) { float m = max(abs(p.x), abs(p.y));
  return 0.7 * sin(p.x * 0.072 + 0.6) * cos(p.y * 0.058 - 0.4) + 0.32 * sin((p.x * 0.6 + p.y * 0.8) * 0.13 + 1.3)
    + 0.12 * sin(p.x * 0.27 - p.y * 0.21 + 2.0) + smoothstep(${DEMI + 4}.0, ${DEMI + 80}.0, m) * 6.0; }`;

// Tuiles « pointe en haut », coordonnées axiales. 2 m entre côtés opposés : rayon intérieur 1 m.
const SQ3 = Math.sqrt(3), HS = 2 / SQ3, OFF = 32, NTEX = 64;
const hexCenter = (q, r) => [HS * SQ3 * (q + r / 2), HS * 1.5 * r];
function toHex(x, z) {
  const qf = (SQ3 / 3 * x - z / 3) / HS, rf = (2 / 3 * z) / HS, yf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf); const y = Math.round(yf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), dy = Math.abs(y - yf);
  if (dq > dr && dq > dy) q = -r - y; else if (dy <= dr) r = -q - y;
  return [q, r];
}
const HEX_GLSL = `
const float HXS = ${HS.toFixed(7)};
vec2 hexOf(vec2 p) {
  float qf = (0.5773503 * p.x - 0.3333333 * p.y) / HXS, rf = (0.6666667 * p.y) / HXS;
  vec3 c = vec3(qf, -qf - rf, rf); vec3 rc = floor(c + 0.5); vec3 d = abs(rc - c);
  if (d.x > d.y && d.x > d.z) rc.x = -rc.y - rc.z; else if (d.y > d.z) rc.y = -rc.x - rc.z; else rc.z = -rc.x - rc.y;
  return vec2(rc.x, rc.z);
}
vec2 hexC(vec2 h) { return vec2(HXS * 1.7320508 * (h.x + 0.5 * h.y), HXS * 1.5 * h.y); }
float hexBord(vec2 d) { return max(abs(d.x), max(abs(0.5 * d.x + 0.8660254 * d.y), abs(-0.5 * d.x + 0.8660254 * d.y))); }
vec4 etatTuile(vec2 h) { ivec2 c = ivec2(h) + ${OFF}; if (c.x < 0 || c.y < 0 || c.x >= ${NTEX} || c.y >= ${NTEX}) return vec4(0.0); return texelFetch(uState, c, 0); }`;

// La frontière entre fané et fleuri : une ligne qui serpente au milieu du champ.
const frontiere = (x, z) => x * 0.84 + z * 0.54 + 3.0 * Math.sin(z * 0.16 + 0.8) + 2.1 * Math.sin(x * 0.21 - 0.5) + 1.1 * Math.sin((x - z) * 0.37);

// Les deux bâtiments, côte à côte au bord du champ, côté fané, à une quarantaine de mètres du départ.
// Les touffes s'arrêtent à six mètres et demi d'eux pour leur laisser une aire dégagée.
const BATS = {
  marche: { x: -(DEMI - 5), z: -27.5, rayon: 2.6, cle: 'marche' },
  atelier: { x: -(DEMI - 5), z: -18.5, rayon: 2.4, cle: 'atelier' },
};
const presBatiment = (x, z, d) => Object.values(BATS).some((b) => Math.hypot(x - b.x, z - b.z) < d);

// Les tuiles sont des entrées de tableaux. t0 : instant de floraison (-1000 : fleurie au départ, 1e6 : fanée).
const T = { q: [], r: [], x: [], z: [], y: [], bloom: [], t0: [], joueur: [] };
const tileIdx = new Int32Array(NTEX * NTEX).fill(-1);
const idxOf = (q, r) => (q < -OFF || q >= OFF || r < -OFF || r >= OFF) ? -1 : tileIdx[(r + OFF) * NTEX + (q + OFF)];
for (let r = -OFF; r < OFF; r++) for (let q = -OFF; q < OFF; q++) {
  const [x, z] = hexCenter(q, r);
  if (Math.abs(x) > DEMI - 0.9 || Math.abs(z) > DEMI - 0.9 || presBatiment(x, z, 6.5)) continue;
  tileIdx[(r + OFF) * NTEX + (q + OFF)] = T.q.length;
  const b = frontiere(x, z) > 0 ? 1 : 0;
  T.q.push(q); T.r.push(r); T.x.push(x); T.z.push(z); T.y.push(H(x, z)); T.bloom.push(b); T.t0.push(b ? -1000 : 1e6); T.joueur.push(0);
}
const NT = T.q.length;
// État lu par les shaders (texture flottante 64×64) : R instant de floraison, G pollinisée par le joueur,
// B dessinée de près (LOD 0 ou 1), A tuile existante.
const etat = new Float32Array(NTEX * NTEX * 4);
const etatTex = new THREE.DataTexture(etat, NTEX, NTEX, THREE.RGBAFormat, THREE.FloatType);
etatTex.magFilter = etatTex.minFilter = THREE.NearestFilter;
const texel = (i) => ((T.r[i] + OFF) * NTEX + (T.q[i] + OFF)) * 4;
function ecrireTuile(i) { const k = texel(i); etat[k] = T.t0[i]; etat[k + 1] = T.joueur[i]; etat[k + 3] = 1; }
for (let i = 0; i < NT; i++) ecrireTuile(i);
etatTex.needsUpdate = true;

// Départ : côté fleuri, dans l'allée entre deux touffes, le regard en biais vers le côté fané,
// une tuile fanée sous le viseur à quatre mètres, et les deux bâtiments dans le champ de vision.
const DEPART = (() => {
  let best = null;
  for (let gx = -9; gx <= 9; gx += 0.5) for (let gz = -9; gz <= 9; gz += 0.5) {
    const [q, r] = toHex(gx, gz), i = idxOf(q, r);
    if (i < 0 || !T.bloom[i] || Math.hypot(gx - T.x[i], gz - T.z[i]) < 0.85) continue;
    const f = frontiere(gx, gz); if (f < 1.2 || f > 3.4) continue;
    for (let a = 0; a < 36; a++) {
      const yaw = a / 36 * Math.PI * 2, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      const tx = gx + fx * 4.2, tz = gz + fz * 4.2, [tq, tr] = toHex(tx, tz), j = idxOf(tq, tr);
      if (j < 0 || T.bloom[j]) continue;
      const face = (fx * 0.84 + fz * 0.54) / Math.hypot(0.84, 0.54); // -1 : face au côté fané
      const bx = (BATS.marche.x + BATS.atelier.x) / 2 - gx, bz = (BATS.marche.z + BATS.atelier.z) / 2 - gz;
      const versBat = Math.acos(clamp((fx * bx + fz * bz) / Math.hypot(bx, bz), -1, 1));   // angle entre le regard et les bâtiments
      const score = Math.abs(face + 0.7) + Math.hypot(tx - T.x[j], tz - T.z[j]) * 0.35 + Math.hypot(gx, gz) * 0.02 + Math.max(0, versBat - 0.45) * 3;
      const pitch = -Math.atan2(H(gx, gz) + 1.62 - H(tx, tz) - 0.3, 4.2);   // le viseur tombe sur la tuile fanée
      if (!best || score < best.score) best = { x: gx, z: gz, yaw, pitch, score };
    }
  }
  return best || { x: 4, z: 4, yaw: 0.9, pitch: -0.28 };
})();

// =====================================================================
// 3. Rendu, lumière, ciel, brume
// =====================================================================
const jeu = document.getElementById('jeu'), canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
let dpr = Math.min(window.devicePixelRatio || 1, Q.dpr);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xeccb9c);

// =====================================================================
// 4. Textures générées sur canvas : chaque matière a son bruit, et une carte
//    de normales tirée du même bruit. Aucune surface de couleur unie.
// =====================================================================
function texFrom(w, h, fn, srgb = true, repeat = 1) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = fn(x, y), i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function normalFrom(w, h, hf, k, repeat = 1) {
  const Hm = new Float32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) Hm[y * w + x] = hf(x, y);
  return texFrom(w, h, (x, y) => {
    const nx = (Hm[y * w + (x + w - 1) % w] - Hm[y * w + (x + 1) % w]) * k, ny = (Hm[((y + h - 1) % h) * w + x] - Hm[((y + 1) % h) * w + x]) * k, L = Math.hypot(nx, ny, 1);
    return [(nx / L * 0.5 + 0.5) * 255, (ny / L * 0.5 + 0.5) * 255, (1 / L * 0.5 + 0.5) * 255];
  }, false, repeat);
}

// =====================================================================
// 5. Le sol : relief, couleur peinte par sommet, texture de terre et normales.
//    Le shader y ajoute l'état de chaque tuile, l'ombre des touffes lointaines,
//    le surlignage de la tuile visée, et la brume au-delà du champ.
// =====================================================================
const U = {   // uniformes partagés par tous les matériaux du champ
  uTime: { value: 0 }, uState: { value: etatTex }, uSel: { value: new THREE.Vector3(0, 0, 0) }, uPulse: { value: 0 },
  uCam: { value: new THREE.Vector3() }, uCamR: { value: new THREE.Vector3(1, 0, 0) }, uWind: { value: new THREE.Vector2(0.8, 0.6).normalize() },
  uPlayer: { value: new THREE.Vector3(0, 0, 0) }, uSunV: { value: new THREE.Vector3() }, uSunW: { value: SUN_DIR },
  uSunC: { value: SOLEIL.clone().multiplyScalar(2) }, uLoin: { value: new THREE.Vector2(Q.lod1 * 0.8, Q.lod1 * 1.6) },
  uOmbreReelle: { value: Q.lod0 }, uHglb: { value: 0 },

const TER = 220;
const terreH = (x, y) => fbm(x / 32, y / 32, 4, 8) * 0.55 + ss(0.7, 0.8, vbruit(x / 6.4, y / 6.4, 40)) * 0.5 + vbruit(x / 2, y / 2, 128) * 0.12;
const REP_SOL = TER / 2.6;   // un motif de texture tous les 2,6 m
const terreTex = texFrom(256, 256, (x, y) => {
  const m = fbm(x / 32, y / 32, 4, 8), c = ss(0.7, 0.8, vbruit(x / 6.4, y / 6.4, 40)), g = vbruit(x / 2, y / 2, 128);
  const v = 0.82 + 0.18 * m + 0.08 * (g - 0.5) + (Math.random() - 0.5) * 0.04;
  return [lerp(242 * v, 236, c * 0.4), lerp(232 * v, 230, c * 0.4), lerp(216 * v, 220, c * 0.4)];
}, true, REP_SOL);
const terreNormales = normalFrom(256, 256, terreH, 1.1, REP_SOL);
{
  const seg = Q.terrain;
  const g = new THREE.PlaneGeometry(TER, TER, seg, seg).rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, H(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const col = new Float32Array(p.count * 3), c = new THREE.Color();
  const terreA = new THREE.Color(0x9b9182), terreB = new THREE.Color(0x8a8173), terreC = new THREE.Color(0xa69d8a), dehors = new THREE.Color(0xb0a98e);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    c.copy(terreA).lerp(terreB, fbm(x / 7 + 3, z / 7 - 1, 3)).lerp(terreC, fbm(x / 23, z / 23, 2) * 0.6);
    c.lerp(dehors, ss(DEMI - 1, DEMI + 6, Math.max(Math.abs(x), Math.abs(z))) * 0.7);
    const creux = H(x, z) - (H(x + 2, z) + H(x - 2, z) + H(x, z + 2) + H(x, z - 2)) / 4;   // creux plus sombres, bosses plus claires
    c.multiplyScalar(1 + clamp(creux * 3, -0.12, 0.08));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, map: terreTex, normalMap: terreNormales, normalScale: new THREE.Vector2(0.55, 0.55) });
  mat.onBeforeCompile = (sh) => {
    for (const k of ['uTime', 'uState', 'uSel', 'uPulse', 'uCam', 'uLoin', 'uSunW', 'uPlayer', 'uOmbreReelle']) sh.uniforms[k] = U[k];
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vMonde;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvMonde = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vMonde;
      uniform highp sampler2D uState; uniform float uTime, uPulse, uOmbreReelle; uniform vec3 uSel, uCam, uSunW, uPlayer; uniform vec2 uLoin;
      ${HEX_GLSL}
      // Ombre des touffes lointaines, calculée sans carte d'ombres : on remonte vers le soleil
      // et on regarde si le rayon traverse le dôme d'une touffe (plus bas quand elle est fanée).
      float ombreTouffes(vec2 wp) {
        vec2 sd = normalize(uSunW.xz); float tE = uSunW.y / length(uSunW.xz); float o = 0.0;
        for (int k = 1; k <= 4; k++) {
          float t = float(k) * 0.38; vec2 q = wp + sd * t; vec2 h = hexOf(q); vec4 s = etatTuile(h);
          if (s.a < 0.5) continue;
          float haut = mix(0.3, 0.62, clamp((uTime - s.r) / 0.3, 0.0, 1.0)), zr = t * tE;
          if (zr > haut) continue;

        }
        return o;
      }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 wp = vMonde.xz; vec2 hq = hexOf(wp); vec4 stT = etatTuile(hq);
      float tuile = stT.a;
      float flT = tuile * clamp((uTime - stT.r - 0.08) / 0.35, 0.0, 1.0);
      float bordT = hexBord(wp - hexC(hq));
      diffuseColor.rgb *= mix(vec3(1.0), mix(vec3(1.1, 1.06, 0.98), vec3(0.8, 0.78, 0.7), flT), tuile);   // poussière pâle / terre riche
      diffuseColor.rgb *= mix(1.0, mix(0.88, 1.0, smoothstep(0.15, 0.6, bordT)) * (1.0 - 0.1 * smoothstep(0.9, 1.0, bordT)), tuile); // ombre sous la touffe, sillon
      float loinT = tuile * smoothstep(uLoin.x, uLoin.y, distance(wp, uCam.xz)) * (1.0 - 0.6 * smoothstep(0.8, 1.0, bordT));
      diffuseColor.rgb = mix(diffuseColor.rgb, mix(vec3(0.5, 0.46, 0.4), vec3(0.42, 0.35, 0.7), flT), loinT * 0.75);   // de loin, le sol prend la couleur de la touffe
      float selT = (tuile > 0.5 && hq == uSel.xy) ? uSel.z : 0.0;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += selT * vec3(1.0, 0.82, 0.48) * (smoothstep(0.87, 0.93, bordT) * (1.0 - smoothstep(0.965, 1.0, bordT)) * 0.26 + 0.012) * (0.75 + 0.25 * uPulse);`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      reflectedLight.directDiffuse *= 1.0 - 0.72 * ombreTouffes(wp) * smoothstep(uOmbreReelle - 0.5, uOmbreReelle + 1.2, distance(wp, uPlayer.xy));`)
      .replace('#include <fog_fragment>', `#include <fog_fragment>
      gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, smoothstep(-1.0, 16.0, max(abs(vMonde.x), abs(vMonde.z)) - ${DEMI}.0) * 0.94);   // le champ se perd dans la brume`);
  };
  const sol = new THREE.Mesh(g, mat);
  sol.receiveShadow = true;
  scene.add(sol);
}


// =====================================================================
// 5 bis. Les fichiers du jeu : de vrais modèles 3D (CC0) et un ciel HDRI.
//    Écran de chargement avec barre de progression ; un fichier absent est
//    remplacé par une forme de substitution, et un message dit lequel.
// =====================================================================
const BASE = params.get('modeles') || '';   // dossier des fichiers (par défaut, à côté de la page)
const FICHIERS = { lavande: 'models/fleur_lavande.glb', marche: 'models/marche.glb', atelier: 'models/atelier.glb', coton: 'models/outil_coton.glb', pinceau: 'models/outil_pinceau.glb', ciel: 'hdri/ciel.hdr' };
const ACTIFS = {}, MANQUANTS = [];
async function chargerTout() {
  const barre = document.querySelector('#chargement .barre i'), etatEl = document.getElementById('chEtat');
  const gltf = new GLTFLoader(), rgbe = new RGBELoader(), cles = Object.keys(FICHIERS), prog = {};
  const majBarre = () => { const v = cles.reduce((t, k) => t + (prog[k] || 0), 0) / cles.length; barre.style.width = Math.round(v * 100) + '%'; etatEl.textContent = `Chargement des modèles… ${Math.round(v * 100)} %`; };
  await Promise.all(cles.map((cle) => new Promise((fin) => {
    const echec = () => { MANQUANTS.push(FICHIERS[cle]); prog[cle] = 1; majBarre(); fin(); };
    try {
      (cle === 'ciel' ? rgbe : gltf).load(BASE + FICHIERS[cle], (res) => { ACTIFS[cle] = res; prog[cle] = 1; majBarre(); fin(); },
        (e) => { if (e && e.lengthComputable) { prog[cle] = 0.95 * e.loaded / e.total; majBarre(); } }, echec);
    } catch (err) { echec(); }
  })));
  etatEl.textContent = 'Préparation du champ…';
}
await chargerTout();
if (ACTIFS.ciel) {   // le HDRI éclaire la scène (ambiance), le soleil directionnel garde les ombres
  const t = ACTIFS.ciel; t.mapping = THREE.EquirectangularReflectionMapping;
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(t).texture; pm.dispose();
  scene.environmentIntensity = 0.8; hemi.intensity = 0.3;
}
// Pose un modèle chargé : base à y = 0, centré, mis à l'échelle (hauteur, ou plus grande dimension horizontale,
// ou plus grande dimension tout court ; avec « axeY », la plus longue dimension est couchée sur l'axe vertical).
function poser(source, { hauteur, largeur, longueur, axeY = false }) {
  const obj = source.clone(true), axe = new THREE.Group(); axe.add(obj);
  if (axeY) {
    const t0 = new THREE.Box3().setFromObject(axe).getSize(new THREE.Vector3());
    if (t0.x >= t0.y && t0.x >= t0.z) axe.rotation.z = Math.PI / 2; else if (t0.z >= t0.y && t0.z >= t0.x) axe.rotation.x = Math.PI / 2;
  }
  axe.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(axe), t = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const k = hauteur ? hauteur / Math.max(t.y, 1e-6) : largeur ? largeur / Math.max(t.x, t.z, 1e-6) : longueur / Math.max(t.x, t.y, t.z, 1e-6);
  const centre = new THREE.Group(); centre.add(axe); centre.position.set(-c.x, -box.min.y, -c.z);
  const g = new THREE.Group(); g.add(centre); g.scale.setScalar(k);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}
// Pour les instances : toutes les pièces du modèle fusionnées par matériau, base à y = 0, hauteur voulue.
function primitives(racine, hauteur) {
  racine.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(racine), c = box.getCenter(new THREE.Vector3()), k = hauteur / Math.max(box.max.y - box.min.y, 1e-6);
  const parMat = new Map(), garder = ['position', 'normal', 'uv', 'color'];
  racine.traverse((o) => {
    if (!o.isMesh) return;
    const mat = Array.isArray(o.material) ? o.material[0] : o.material;
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld); g.translate(-c.x, -box.min.y, -c.z); g.scale(k, k, k);
    if (g.index) g = g.toNonIndexed();
    if (!g.attributes.normal) g.computeVertexNormals();
    if (!parMat.has(mat)) parMat.set(mat, []); parMat.get(mat).push(g);
  });
  const res = [];
  for (const [mat, gs] of parMat) {
    const noms = garder.filter((n) => gs.every((g) => g.attributes[n]));
    gs.forEach((g) => Object.keys(g.attributes).forEach((n) => { if (!noms.includes(n)) g.deleteAttribute(n); }));
    const g = mergeGeometries(gs); if (!g) continue;
    const pos = g.attributes.position, hp = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) hp[i * 2] = pos.getY(i);   // chaque sommet s'attache à l'axe à sa propre hauteur
    g.setAttribute('aHP', new THREE.BufferAttribute(hp, 2));
    g.setAttribute('aFC', new THREE.BufferAttribute(new Float32Array(pos.count * 4), 4));
    g.setAttribute('aFA', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
    res.push({ g, mat, tris: pos.count / 3 });
  }
  return res;
}

// =====================================================================
// 6. La lavande. Une touffe par tuile, 30 à 60 brins. Chaque brin : tige fine à
//    section carrée, deux ou trois paires de feuilles étroites gris-vert, un épi de
//    20 à 30 fleurs étagées, chacune une corolle à quatre lobes (LatheGeometry),
//    étamines et pollen au cœur des fleurs ouvertes. Tout est en InstancedMesh ;
//    la courbure, le vent, la floraison et l'affaissement sont faits dans le shader.
// =====================================================================
const VARIANTES = [   // cinq formes, mélangées dans chaque touffe
  { L: 0.52, epi: 0.125, verts: 8, fleurs: 24, paires: 2, graine: 11 },
  { L: 0.58, epi: 0.145, verts: 9, fleurs: 28, paires: 3, graine: 23 },
  { L: 0.48, epi: 0.105, verts: 7, fleurs: 21, paires: 2, graine: 37 },
  { L: 0.62, epi: 0.155, verts: 9, fleurs: 30, paires: 3, graine: 41 },
  { L: 0.55, epi: 0.135, verts: 8, fleurs: 26, paires: 3, graine: 59 },
];
const NV = VARIANTES.length, SQ2 = Math.SQRT2;

// Assemblage de géométrie avec les attributs de la lavande :
//   aHP : hauteur d'attache sur l'axe du brin, partie (0 tige, 1 feuille, 2 corolle, 3 étamine, 4 pollen)
//   aFC : centre de la fleur et poids du lobe (0 au fond de la corolle, 1 au bord)
//   aFA : axe de la fleur (longueur 2 : bouton qui reste fermé)
class Assemblage {
  constructor() { this.p = []; this.n = []; this.hp = []; this.fc = []; this.fa = []; this.idx = []; }
  get nv() { return this.p.length / 3; }
  sommet(x, y, z, nx, ny, nz, h, part, fc = null, fa = null, w = 0) {
    this.p.push(x, y, z); this.n.push(nx, ny, nz); this.hp.push(h, part);
    this.fc.push(fc ? fc[0] : 0, fc ? fc[1] : 0, fc ? fc[2] : 0, w); this.fa.push(fa ? fa[0] : 0, fa ? fa[1] : 0, fa ? fa[2] : 0);
    return this.nv - 1;
  }
  ajouter(g, m, h, part, fc = null, fa = null, poids = null) {
    const base = this.nv, P = g.attributes.position, N = g.attributes.normal, nm = new THREE.Matrix3().getNormalMatrix(m), v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let k = 0; k < P.count; k++) {
      v.fromBufferAttribute(P, k).applyMatrix4(m); n.fromBufferAttribute(N, k).applyMatrix3(nm).normalize();
      this.sommet(v.x, v.y, v.z, n.x, n.y, n.z, h, part, fc, fa, poids ? poids(k) : 0);
    }
    const I = g.index.array; for (let k = 0; k < I.length; k++) this.idx.push(base + I[k]);
  }
  geometrie() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('aHP', new THREE.Float32BufferAttribute(this.hp, 2));
    g.setAttribute('aFC', new THREE.Float32BufferAttribute(this.fc, 4));
    g.setAttribute('aFA', new THREE.Float32BufferAttribute(this.fa, 3));
    g.setIndex(this.idx);
    return g;
  }
}
// Corolle : un tour de LatheGeometry dont l'anneau du bord est creusé quatre fois (quatre lobes).
function corolle(profil, segs, creux) {

const FLEUR = corolle([[0.0016, 0], [0.0034, 0.0086], [0.0092, 0.0120]], 8, 0.45);    // fleur ouverte
const BOUTON = corolle([[0.0016, 0], [0.0031, 0.0068], [0.0010, 0.0112]], 8, 0.15);   // bouton fermé
const FLEUR_L1 = corolle([[0.0019, 0], [0.0070, 0.0112]], 4, 0);                      // fleur simplifiée (LOD 1)
const ETAMINE = new THREE.LatheGeometry([new THREE.Vector2(0.0006, 0.0048), new THREE.Vector2(0.0006, 0.0138)], 3);
const POLLEN = new THREE.LatheGeometry([new THREE.Vector2(0.00002, 0.013), new THREE.Vector2(0.0023, 0.0148), new THREE.Vector2(0.00002, 0.0168)], 4);
const FEUILLE = (() => {   // feuille étroite à nervure pliée, longueur et largeur 1 (mises à l'échelle à la pose)
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0.45, 0.06, -0.5, 0.45, 0.1, 0, 0.45, 0.06, 0.5, 1, -0.08, 0], 3));

// Tige à section carrée (faces plates en pleine définition), de 4,6 mm à la base à 2,6 mm en haut.
function tige(A, L, segs, plat) {
  const anneaux = [];
  for (let s = 0; s <= segs; s++) {

  for (let k = 0; k < 6; k++) { const m = (t0 + t) / 2; if (o.y + _dir.y * m <= H(o.x + _dir.x * m, o.z + _dir.z * m) + VISEE_H) t = m; else t0 = m; }
  const [q, r] = toHex(o.x + _dir.x * t, o.z + _dir.z * t);
  return idxOf(q, r);
}
const jauge = { tuile: -1, p: 0, vue: 0, fin: -10, finTuile: -1, dern: -1 };
let cible = -1, cibleSel = 0, pollinisees = 0;
function fleurir(i) {
  if (i < 0 || T.bloom[i]) return;
  T.bloom[i] = 1; T.t0[i] = gt; T.joueur[i] = 1; ecrireTuile(i); etatTex.needsUpdate = true;
  pollinisees++;
  recentes.unshift(i); if (recentes.length > 30) recentes.pop();
  affecterAbeilles(joueur.x, joueur.z);   // trois abeilles arrivent
  bouffees.emettre(i, gt);

}
let zone = null, actionAvant = false, libelle = '', libelleGris = false;
function polliniser(dt) {
  cible = viser();
  const fanee = cible >= 0 && !T.bloom[cible], info = OUTIL_INFO[eco.outil];
  const plein = eco.panier >= info.panier, peut = !zone && !plein;
  if (E.action && fanee && peut) {
    if (jauge.tuile !== cible) { jauge.tuile = cible; jauge.p = 0; }
    jauge.p += dt / info.duree;   // tige de coton : 3 s ; pinceau : 1 s
    if (jauge.p >= 1) { jauge.fin = gt; jauge.finTuile = cible; jauge.p = 0; jauge.tuile = -1; fleurir(cible); eco.panier = Math.min(info.panier, eco.panier + 1); }
  } else { jauge.p = 0; jauge.tuile = -1; }   // relâcher (ou viser ailleurs) annule et vide la jauge
  if (jauge.tuile >= 0) jauge.dern = jauge.tuile;
  jauge.vue = jauge.p >= jauge.vue ? jauge.p : Math.max(jauge.p, jauge.vue - dt * 4);
  const eclat = clamp(1 - (gt - jauge.fin) / 0.35, 0, 1);
  const iA = jauge.tuile >= 0 ? jauge.tuile : eclat > 0 ? jauge.finTuile : jauge.vue > 0.001 ? jauge.dern : -1;
  jaugeMesh.visible = iA >= 0;
  if (iA >= 0) {
    jaugeMesh.position.set(T.x[iA], T.y[iA] + 0.95, T.z[iA]); jaugeMesh.quaternion.copy(camera.quaternion);
    const sc = 0.36 * (1 + eclat * 0.3); jaugeMesh.scale.set(sc, sc, sc);
    jaugeMat.uniforms.uP.value = eclat > 0 ? 1 : jauge.vue; jaugeMat.uniforms.uFlash.value = eclat; jaugeMat.uniforms.uA.value = eclat > 0 ? eclat : 1;
  }
  // Surlignage : franc sur une tuile fanée, discret sur une tuile déjà fleurie.
  if (cible >= 0) { if (U.uSel.value.x !== T.q[cible] || U.uSel.value.y !== T.r[cible]) { U.uSel.value.x = T.q[cible]; U.uSel.value.y = T.r[cible]; cibleSel = 0; } cibleSel = Math.min(1, cibleSel + dt * 8); }
  else cibleSel = Math.max(0, cibleSel - dt * 8);
  U.uSel.value.z = cibleSel * (fanee ? 1 : 0.45);
  bouton.classList.toggle('pret', fanee && peut);
  if (!zone) { libelle = fanee && plein ? 'Panier plein' : ''; libelleGris = true; }
}
// Près d'un bâtiment (moins de trois mètres), l'action vend ou achète, à l'appui.
function batiments() {
  zone = null;
  for (const b of Object.values(BATS)) if (Math.hypot(joueur.x - b.x, joueur.z - b.z) - b.rayon < 3) zone = b.cle;
  const appui = E.action && !actionAvant; actionAvant = E.action;
  const panneau = document.getElementById('panneau');
  if (zone === 'marche') {
    libelle = eco.panier ? `Vendre ${eco.panier} fleur${eco.panier > 1 ? 's' : ''} — ${eco.panier * PRIX_FLEUR} crédits` : 'Panier vide'; libelleGris = !eco.panier;
    if (appui && eco.panier) vendre();
  } else if (zone === 'atelier') {
    const p = OUTIL_INFO.pinceau, deja = eco.outil === 'pinceau', assez = eco.credits >= p.prix;
    libelle = deja ? 'Pinceau déjà en main' : assez ? `Acheter le pinceau — ${p.prix} crédits` : `Il manque ${p.prix - eco.credits} crédits`; libelleGris = deja || !assez;
    if (appui && !deja && assez) acheter();
  }
  panneau.hidden = zone !== 'atelier' || eco.outil === 'pinceau';
  if (!panneau.hidden) { const p = OUTIL_INFO.pinceau; document.getElementById('pnNom').textContent = p.nom; document.getElementById('pnPrix').textContent = `${p.prix} crédits`; document.getElementById('pnEffet').textContent = p.effet; }
}
let gainFin = -1;
function afficherGain(txt) { const g = document.getElementById('gain'); g.textContent = txt; g.hidden = false; gainFin = gt + 0.55; }
function vendre() {
  const n = eco.panier, gain = n * PRIX_FLEUR;
  for (let k = 0; k < Math.min(n, 28); k++) vols.push({ k: eco.vendues + k, t0: gt + k * 0.03, x: joueur.x, y: joueur.y + 1.2, z: joueur.z });
  eco.credits += gain; eco.vendues += n; eco.panier = 0;
  son.pieces(n); afficherGain(`+${gain}`);
}
function acheter() {
  eco.credits -= OUTIL_INFO.pinceau.prix; eco.outil = 'pinceau'; prendreOutil('pinceau'); majVitrine();
  son.achat(); afficherGain('Pinceau à pollen');
}
// Interface : crédits, outil, panier, invite d'action, marqueur d'objectif.
const hud = { credits: document.querySelector('#credits b'), outil: document.getElementById('outilNom'), panierN: document.getElementById('panierN'), panier: document.getElementById('panier'), invite: document.getElementById('invite'), lib: bouton.querySelector('.libelle'), obj: document.getElementById('objectif') };
let hudCache = '', LARG = innerWidth, HAUT = innerHeight;
const _po = new THREE.Vector3();
function majInterface() {
  const info = OUTIL_INFO[eco.outil], cle = [eco.credits, eco.panier, eco.outil, libelle, libelleGris].join('|');
  if (cle !== hudCache) {
    hudCache = cle;
    hud.credits.textContent = eco.credits; hud.outil.textContent = info.nom; hud.panierN.textContent = `Panier ${eco.panier} / ${info.panier}`;
    hud.panier.classList.toggle('plein', eco.panier >= info.panier);
    hud.lib.textContent = libelle; bouton.classList.toggle('texte', !!libelle); bouton.classList.toggle('gris', !!libelle && libelleGris);
    hud.invite.hidden = MOBILE || !libelle; hud.invite.textContent = libelleGris ? libelle : 'Clic : ' + libelle; hud.invite.classList.toggle('gris', libelleGris);
    majVitrine();
  }
  if (gainFin > 0 && gt > gainFin) { document.getElementById('gain').hidden = true; gainFin = -1; }
  // Marqueur : vers le marché quand le panier est plein, vers l'atelier quand le pinceau est abordable.
  const but = eco.panier >= info.panier ? BATS.marche : (eco.outil === 'coton' && eco.credits >= PRIX_PINCEAU) ? BATS.atelier : null;
  hud.obj.hidden = !but || zone === (but && but.cle);
  if (!hud.obj.hidden) {
    _po.set(but.x, but.y + but.haut + 1, but.z).project(camera);
    let x = _po.x, y = _po.y; if (_po.z > 1) { x = -x; y = -1; }   // derrière : sur le bord du bas
    const m = 0.9; if (Math.abs(x) > m || Math.abs(y) > m) { const k = m / Math.max(Math.abs(x), Math.abs(y)); x *= k; y *= k; }
    hud.obj.style.transform = `translate(${(x * 0.5 + 0.5) * LARG - 8}px, ${(-y * 0.5 + 0.5) * HAUT - 8}px)`;
    hud.obj.lastChild.textContent = but.cle === 'marche' ? 'Marché' : 'Atelier';
  }
}
// L'outil en main : respiration à l'arrêt, léger balancement en marchant ; en pollinisant, il avance et
// tamponne en petits cercles (la tête de coton se dore), puis un petit coup sec à la fin.
let geste = 0;
const cotonBlanc = new THREE.Color(0xf3e2b0), cotonDore = new THREE.Color(0xf0b52c);
function majOutil(dt) {
  const a = clamp(joueur.vitesse / VIT, 0, 1.4), sb = Math.sin(joueur.pas), cb = Math.abs(Math.cos(joueur.pas));
  const souffle = Math.sin(gt * 1.4) * 0.004;
  geste = lerp(geste, E.action && !zone ? 1 : 0, 1 - Math.exp(-dt * 10));
  const charge = jauge.tuile >= 0 ? 1 : 0.35, w = gt * (eco.outil === 'pinceau' ? 14 : 9);
  const rondX = Math.cos(w) * 0.01 * geste * charge, rondY = Math.sin(w) * 0.007 * geste * charge;
  const fl = clamp(1 - (gt - jauge.fin) / 0.35, 0, 1), coup = Math.sin(fl * Math.PI) * 0.03;
  outilVue.position.set(POSE.x + sb * 0.014 * a - retardRegard * 0.3 - 0.04 * geste + rondX, POSE.y - cb * 0.012 * a + souffle + retardRegardV * 0.25 + 0.02 * geste + rondY + coup, POSE.z - 0.06 * geste);
  outilVue.rotation.set(POSE.rx + sb * 0.04 * a - 0.15 * geste - coup * 3, POSE.ry + retardRegard + 0.1 * geste, POSE.rz - retardRegard * 0.5);
  cotonTete.color.copy(cotonBlanc).lerp(cotonDore, Math.max(jauge.vue, fl) * 0.8);
  cotonTete.emissive.copy(cotonDore).multiplyScalar(jauge.vue * 0.25);
}

// =====================================================================
// 14. Post-traitement : bloom léger ; sur ordinateur, une vignette discrète.
// =====================================================================
const flottant = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const cibleRendu = new THREE.WebGLRenderTarget(1, 1, { type: flottant ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: Q.msaa });
const composer = new EffectComposer(renderer, cibleRendu);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), MOBILE ? 0.2 : 0.24, 0.4, 0.9);
composer.addPass(bloom);
if (Q.vignette) composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec2 c = vUv - 0.5; vec3 col = texture2D(tDiffuse, vUv).rgb; col *= 1.0 - smoothstep(0.2, 0.75, dot(c, c) * 1.3) * 0.26; gl_FragColor = vec4(col, 1.0); }',
}));
composer.addPass(new OutputPass());
function disposer() {
  tourne = MOBILE && innerHeight > innerWidth;
  const W = tourne ? innerHeight : innerWidth, Hh = tourne ? innerWidth : innerHeight;
  jeu.style.width = W + 'px'; jeu.style.height = Hh + 'px';
  jeu.style.transform = tourne ? `translate(${innerWidth}px, 0) rotate(90deg)` : 'none';
  renderer.setPixelRatio(dpr); renderer.setSize(W, Hh, false);
  composer.setPixelRatio(dpr); composer.setSize(W, Hh);
  camera.aspect = W / Hh;
  camera.fov = clamp(2 * Math.atan(Math.tan(50 * Math.PI / 180) / camera.aspect) * 180 / Math.PI, 52, 72);   // environ 100° à l'horizontale
  camera.updateProjectionMatrix();
  LARG = W; HAUT = Hh;
  grains.uniforms.uTaille.value = 0.014 * Hh * dpr / (2 * Math.tan(camera.fov * Math.PI / 360));   // grain d'environ 1,4 cm (lumineux)
}
disposer();
addEventListener('resize', disposer);
addEventListener('orientationchange', () => setTimeout(disposer, 250));

// =====================================================================
// 15. La boucle, la qualité automatique, et une petite interface pour les tests
// =====================================================================
function majOmbres() {   // la carte d'ombres suit le joueur, calée sur sa grille pour ne pas scintiller
  const z = zoneOmbre(), st = (z * 2) / Q.ombres, sx = Math.round(joueur.x / st) * st, sz = Math.round(joueur.z / st) * st, sy = H(sx, sz);
  sun.target.position.set(sx, sy, sz); sun.position.set(sx + SUN_DIR.x * 30, sy + SUN_DIR.y * 30, sz + SUN_DIR.z * 30);
  sun.target.updateMatrixWorld();
}
let tAbeilles = 0;
function majMonde(dt) {
  gt += dt; U.uTime.value = gt;
  majJoueur(dt); majCamera(); batiments(); polliniser(dt); majOutil(dt); majVols(); majInterface();
  if (Math.hypot(joueur.x - centreLod.x, joueur.z - centreLod.z) > 1) reconstruire(joueur.x, joueur.z);
  if ((tAbeilles -= dt) <= 0) { tAbeilles = 0.6; affecterAbeilles(joueur.x, joueur.z); }
  majAbeilles();
  U.uPlayer.value.set(joueur.x, joueur.z, 1);
  U.uCam.value.copy(camera.position);
  U.uCamR.value.set(Math.cos(joueur.yaw), 0, -Math.sin(joueur.yaw));
  U.uSunV.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  U.uPulse.value = 0.5 + 0.5 * Math.sin(gt * 5);
  grains.uniforms.uCentre.value.set(joueur.x, joueur.z);
  majOmbres();
  ciel.position.copy(camera.position);
}
let fps = 60, accF = 0, nF = 0, controles = 0;
function qualiteAuto(raw) {   // sous 52 img/s : résolution, puis rayons de détail, puis bloom
  if (raw > 0.5) return;
  accF += raw; nF++;
  if (accF < 2) return;
  fps = nF / accF; accF = 0; nF = 0; controles++;
  if (!Q.auto || controles < 3 || fps >= 52) return;
  if (dpr > 1.01) { dpr = Math.max(1, dpr - 0.25); disposer(); }
  else if (Q.lod1 > 6.01) {
    Q.lod0 = Math.max(1.6, Q.lod0 * 0.8); Q.lod1 = Math.max(6, Q.lod1 * 0.8);
    U.uLoin.value.set(Q.lod1 * 0.8, Q.lod1 * 1.6); U.uOmbreReelle.value = Q.lod0; cadrerOmbres(); reconstruire(joueur.x, joueur.z);
  } else if (bloom.enabled) bloom.enabled = false;
}
const dbg = document.getElementById('debug');
if (DEBUG) dbg.hidden = false;
let dernier = performance.now();
function image(now) {
  requestAnimationFrame(image);   // en premier : une erreur dans une image n'arrête pas la boucle
  const raw = (now - dernier) / 1000; dernier = now;
  qualiteAuto(raw);
  if (!window.pollen.figer) majMonde(Math.min(0.05, Math.max(0, raw)));   // figer : réservé aux captures des tests
  renderer.info.reset();
  composer.render();
  if (DEBUG) dbg.textContent = `${Q.nom} · ${fps.toFixed(0)} img/s · ratio ${dpr}\ntriangles ${(renderer.info.render.triangles / 1000).toFixed(0)} k · appels ${renderer.info.render.calls}\ndétail ${Q.lod0.toFixed(1)} / ${Q.lod1.toFixed(1)} m · tuile visée ${cible}\njoueur ${joueur.x.toFixed(1)} ${joueur.z.toFixed(1)}`;
}
window.pollen = {
  figer: false,
  Q, T, H, toHex, idxOf, hexCenter, joueur, E, camera, scene, renderer, composer, jauge, abeilles, son, U, DEPART, SUN_DIR, LOD, LOIN, OUTILS, outilVue, eco, BATS, ACTIFS, MANQUANTS, PROCHE_GLB, vitrine, pile, vendre, acheter, get zone() { return zone; },
  VARIANTES, viser, fleurir, abeillesSur, reconstruire,
  brinsTuile: (i) => { let n = 0; for (let v = 0; v < NV; v++) n += blocs[(i * NV + v) * 2 + 1]; return n; },
  get cible() { return cible; }, get gt() { return gt; },
  // Avance la simulation sans attendre l'affichage (le rendu logiciel des tests tourne à 1 img/s).
  step(dt, n = 1) { for (let k = 0; k < n; k++) majMonde(dt); return { x: joueur.x, z: joueur.z, y: joueur.y, yaw: joueur.yaw, pitch: joueur.pitch, vitesse: joueur.vitesse, cible, jauge: jauge.p }; },
  stats() {
    let lod0 = 0, lod1 = 0; (LOD[0] || []).forEach((o) => { lod0 += o.m.count; }); (LOD[1] || []).forEach((o) => { lod1 += o.m.count; });
    if (PROCHE_GLB) lod1 = PROCHE_GLB.meshes[0].count;
    return { tuiles: NT, fleuries: T.bloom.reduce((s, b) => s + b, 0), brins: totalBrins, lod0, lod1, loin: LOIN.m.count, triangles: renderer.info.render.triangles, appels: renderer.info.render.calls, sons: son.n, pollinisees, abeilles: beeCorps.count };
  },
  fps: () => fps,
};

// Départ : touffes proches détaillées, abeilles déjà en place, première image.
reconstruire(joueur.x, joueur.z);
affecterAbeilles(joueur.x, joueur.z); for (const b of abeilles) b.arr = -10;
majMonde(0);
requestAnimationFrame(image);
if (document.getElementById('panne').textContent.startsWith('Le moteur 3D')) document.getElementById('panne').hidden = true;
// Fin du chargement : on retire l'écran ; s'il manque des fichiers, un message dit lesquels.
document.getElementById('chargement').hidden = true;
if (MANQUANTS.length) {
  const n = document.getElementById('notice');
  n.firstChild.textContent = `${MANQUANTS.length > 1 ? 'Fichiers absents' : 'Fichier absent'} : ${MANQUANTS.join(', ')}. Des formes de substitution les remplacent en attendant.`
    + (location.protocol === 'file:' ? ' La page est ouverte par un double-clic : le navigateur bloque alors les modèles. Ouvre-la par un serveur (itch.io, Live Server, ou « python -m http.server »).' : '');
  n.hidden = false;
  document.getElementById('noticeOk').addEventListener('click', () => { n.hidden = true; });
}
