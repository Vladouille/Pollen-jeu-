<!--

  activités (chardons, irrigation, ruches, essaims, balises), automatisation (construction, convoyeurs, machines,
  pollinisatrice, contrats, événements, nuit, nouveautés toutes les 8 minutes, sauvegarde). ?neuf pour repartir de zéro. Une station agricole propre à POLLEN :
  matériel manufacturé, arêtes chanfreinées, socles à gradins, rainures de panneaux,
  quatre couleurs pour tout le matériel (blanc cassé, graphite, jaune pollen, vert sève lumineux).

  ?mode=pc ou ?mode=mobile pour forcer l'appareil, ?debug pour les compteurs.
-->
<style>
  /* Charte POLLEN : blanc cassé, graphite, jaune pollen, vert sève ; une seule police sans empattement, grasse. */
  :root { --blanc: #ece8df; --graphite: #2f3338; --pollen: #f4b41a; --seve: #53d17a; --encre: #fffdf7; --voile: rgba(28, 31, 35, .55); --fond: #cfe6f7; color-scheme: light; }

  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font: 800 14px/1.2 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--encre); }
  #jeu { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; }
  #c { display: block; width: 100%; height: 100%; outline: none; cursor: crosshair; }
  #reticule { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid rgba(255, 253, 247, .85); box-shadow: 0 0 0 1px rgba(28, 31, 35, .35); pointer-events: none; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 253, 247, .6); background: rgba(28, 31, 35, .18); pointer-events: none; }
  .stick b { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255, 253, 247, .85); }
  .btn { position: absolute; border-radius: 50%; border: 2.5px solid rgba(255, 253, 247, .75); background: rgba(28, 31, 35, .3); color: var(--encre); font: 800 20px/1 inherit; display: grid; place-items: center; touch-action: none; padding: 0; }
  #agir { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; }
  #agir.pret, #inter.pret { border-color: var(--pollen); box-shadow: 0 0 18px rgba(244, 180, 26, .5); }
  #agir.appui { transform: scale(.92); background: rgba(244, 180, 26, .3); }
  #inter { right: calc(124px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; }
  #debug { position: absolute; left: 10px; top: 60px; margin: 0; padding: 6px 9px; border-radius: 6px; background: rgba(0, 0, 0, .45); font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #panne { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9; padding: 10px 14px; border-radius: 8px; background: rgba(47, 51, 56, .92); }

  /* Interface : plaques graphite translucides, coins chanfreinés (clip-path), chiffres jaune pollen. */
  #hud { position: absolute; inset: 0; pointer-events: none; --pad: 14px; }
  .plaque { position: absolute; background: rgba(32, 35, 39, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; margin-right: 7px; border-radius: 4px; background: var(--pollen); color: var(--graphite); font: 900 12px/1 inherit; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
  kbd.off { background: #6c7076; color: var(--blanc); }
  /* 1. Boussole : ruban centré en haut, trait jaune au cap, chevron de l'objectif avec sa distance. */
  #boussole { left: 50%; top: calc(var(--pad) + env(safe-area-inset-top, 0px)); width: min(380px, 46vw); height: 30px; margin-left: calc(min(380px, 46vw) / -2); overflow: hidden; }
  #boussole::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 9px; margin-left: -1px; background: var(--pollen); }
  #bande { position: absolute; inset: 0; }
  #bande i { position: absolute; left: 50%; bottom: 3px; width: 30px; margin-left: -15px; text-align: center; font: 800 12px/1 inherit; font-style: normal; color: var(--encre); }
  #bande i.g::before { content: ''; display: block; width: 1px; height: 6px; margin: 0 auto; background: rgba(255, 253, 247, .5); }
  #bande i.c { bottom: 8px; }
  #cible { position: absolute; left: 50%; top: calc(var(--pad) + 42px + env(safe-area-inset-top, 0px)); transform-origin: 0 0; white-space: nowrap; }
  #cible::before { content: ''; position: absolute; left: -6px; top: -12px; border: 6px solid transparent; border-bottom: 8px solid var(--pollen); }
  #cible span { position: absolute; left: 0; top: 2px; transform: translateX(-50%); padding: 3px 8px; background: rgba(32, 35, 39, .7); color: var(--pollen); font-size: 12px; border-radius: 3px; }
  #cible.bord::before { border-bottom-color: #c9c3b6; }
  #boussoleBloc { position: absolute; left: 0; right: 0; top: 0; height: 64px; }
  .marq { position: absolute; left: 50%; top: 3px; width: 10px; height: 10px; margin-left: -5px; transform-origin: 5px 5px; background: var(--seve); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .marq.essaim { background: #ffd35a; }
  .marq.doree { background: var(--pollen); clip-path: circle(50%); }
  /* 2. Secteur : anneau de progression en haut à gauche. */
  #secteur { left: calc(var(--pad) + env(safe-area-inset-left, 0px)); top: calc(var(--pad) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 7px; }
  #secteur svg { width: 44px; height: 44px; transform: rotate(-90deg); }
  #secteur circle { fill: none; stroke-width: 5; }
  #secteur .fond { stroke: rgba(255, 253, 247, .18); }
  #arc { stroke: var(--seve); stroke-dasharray: 113.1; stroke-dashoffset: 113.1; stroke-linecap: round; transition: stroke-dashoffset .3s; }
  #secteur small { display: block; font-size: 10px; letter-spacing: .08em; color: #c9c3b6; }
  #secteur strong { font-size: 19px; color: var(--encre); }
  /* 3. Pastille de l'outil en bas à gauche : nom, charge « x / 12 KG », jauge verticale. */
  #pastille { left: calc(var(--pad) + env(safe-area-inset-left, 0px)); bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px)); display: flex; align-items: stretch; gap: 10px; padding: 9px 14px 9px 9px; }
  #pastille .tube { position: relative; width: 12px; height: 40px; border-radius: 6px; background: rgba(255, 253, 247, .15); overflow: hidden; }
  #jauge { position: absolute; inset: 0; background: linear-gradient(var(--pollen), #e09a00); transform-origin: 50% 100%; transform: scaleY(0); transition: transform .2s; }
  #pastille .tube.plein #jauge { background: var(--seve); }
  #pastille small { display: block; font-size: 11px; color: #c9c3b6; }
  #charge { display: block; margin-top: 3px; font-size: 20px; color: var(--pollen); letter-spacing: .02em; }

  #slots { position: absolute; left: 50%; bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
  #slots button { position: relative; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 253, 247, .35); background: rgba(32, 35, 39, .6); display: grid; place-items: center; cursor: pointer; }
  #slots button.actif { border-color: var(--pollen); box-shadow: 0 0 0 3px rgba(244, 180, 26, .25); background: rgba(47, 51, 56, .85); }
  #slots svg { width: 24px; height: 24px; fill: none; stroke: var(--encre); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #slots button.actif svg { stroke: var(--pollen); }
  #slots kbd { position: absolute; top: -7px; right: -9px; min-width: 17px; height: 17px; margin: 0; font-size: 10px; padding: 0 3px; }
  /* 5. Crédits en bas à droite, pièce hexagonale jaune. */
  #credits { right: calc(var(--pad) + env(safe-area-inset-right, 0px)); bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 9px; padding: 9px 15px 9px 11px; }
  .piece { width: 24px; height: 24px; background: var(--pollen); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); position: relative; }
  .piece::after { content: ''; position: absolute; inset: 6px; background: #c78f00; clip-path: inherit; }
  #cr { font-size: 22px; color: var(--encre); min-width: 2ch; }
  #gains { position: absolute; right: calc(var(--pad) + 16px + env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); text-align: right; }
  #gains p { margin: 0; font-size: 20px; color: var(--pollen); text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
  /* 6. Raccourcis sur le bord droit. */
  #raccourcis { position: absolute; right: calc(var(--pad) + env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; justify-items: end; }
  #raccourcis li { display: flex; align-items: center; padding: 4px 9px 4px 5px; background: rgba(32, 35, 39, .45); border-radius: 4px; font-size: 12px; color: var(--encre); }
  #raccourcis li[data-tap] { pointer-events: auto; cursor: pointer; }
  /* 7. Badge de touche en contexte sous le réticule, avec la progression du geste. */
  #contexte { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); display: flex; align-items: center; padding: 6px 12px 6px 6px; background: rgba(32, 35, 39, .62); border-radius: 4px; white-space: nowrap; font-size: 13px; --p: 0; }
  #contexte::after { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p) * 100%); background: var(--seve); }
  /* 8. Étiquettes flottantes près des machines : badge E et nom sur fond sombre. */
  #etiquettes { position: absolute; inset: 0; }
  .etiq { position: absolute; left: 0; top: 0; display: flex; align-items: center; padding: 4px 10px 4px 4px; background: rgba(26, 29, 33, .78); border-radius: 4px; white-space: nowrap; font-size: 13px; transform-origin: 50% 100%; }
  .etiq::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(26, 29, 33, .78); }
  .etiq kbd { background: #6c7076; color: var(--blanc); }
  .etiq.vise { outline: 2px solid var(--pollen); }
  .etiq.vise kbd { background: var(--pollen); color: var(--graphite); }
  .etiq.off.vise kbd { background: #6c7076; color: var(--blanc); }
  #messages { position: absolute; left: 50%; top: calc(var(--pad) + 76px); transform: translateX(-50%); text-align: center; }
  #messages p { margin: 0 auto 5px; padding: 5px 12px; width: max-content; max-width: min(520px, 70vw); background: rgba(32, 35, 39, .65); border-radius: 4px; font-size: 13px; animation: surgir .25s ease-out; }
  #messages p.gain { color: var(--pollen); } #messages p.alerte { color: #ffb4a0; } #messages p.evenement { color: var(--graphite); background: var(--pollen); }
  @keyframes surgir { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { #messages p { animation: none; } }
  /* Bandeau d'état (jour, énergie, événement) sous l'anneau du secteur. */
  #etat { left: calc(var(--pad) + env(safe-area-inset-left, 0px)); top: calc(var(--pad) + 66px + env(safe-area-inset-top, 0px)); padding: 6px 12px; font-size: 12px; }
  #etat p { margin: 2px 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #etat small { color: #c9c3b6; font-size: 11px; } #etat b { color: var(--pollen); } #etat b.alerte { color: #ffb4a0; }
  .soleil, .lune, .eclair { width: 12px; height: 12px; display: inline-block; flex: none; }
  .soleil { border-radius: 50%; background: var(--pollen); box-shadow: 0 0 6px var(--pollen); }
  .lune { border-radius: 50%; box-shadow: inset -4px -1px 0 0 #dfe6f2; }
  .eclair { background: var(--seve); clip-path: polygon(55% 0, 15% 55%, 45% 55%, 35% 100%, 85% 40%, 55% 40%); }
  /* Panneau des contrats (Tab ou E à la station). */
  #contrats { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 80vw); padding: 14px 18px; }
  #contrats h2 { margin: 0 0 10px; font-size: 15px; color: var(--encre); } #contrats h2 small { color: var(--pollen); font-size: 11px; margin-left: 6px; }
  .contrat { margin: 8px 0 12px; } .contrat p { margin: 0 0 5px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; } .contrat b { color: var(--pollen); white-space: nowrap; }
  .contrat span { display: block; height: 6px; border-radius: 3px; background: rgba(255, 253, 247, .15); overflow: hidden; }
  .contrat span i { display: block; height: 100%; background: var(--pollen); transform-origin: 0 50%; }
  .contrat.fini span i { background: var(--seve); } .contrat small { font-size: 11px; color: #c9c3b6; }
  /* Téléphone : crédits en haut à droite (les boutons d'action occupent le bas), raccourcis réduits. */
  .mobile #credits { bottom: auto; top: calc(var(--pad) + env(safe-area-inset-top, 0px)); }
  .mobile #gains { bottom: auto; top: 64px; }
  .mobile #raccourcis { top: 40%; } .mobile #etat { font-size: 11px; } .mobile #raccourcis li:not([data-tap]) { display: none; }
  .mobile #slots button { width: 44px; height: 44px; }
  .mobile #boussole { width: min(300px, 40vw); margin-left: calc(min(300px, 40vw) / -2); }

</style>
