  camera.position.set(joueur.x + Math.cos(joueur.yaw) * sb * 0.02 * a, joueur.y + OEIL + Math.abs(sb) * 0.045 * a - 0.02 * a, joueur.z - Math.sin(joueur.yaw) * sb * 0.02 * a);
  camera.rotation.set(joueur.pitch, joueur.yaw, sb * 0.004 * a, 'YXZ');
  camera.updateMatrixWorld();
}
// Le corps invisible : il n'écrit ni couleur ni profondeur, mais projette son ombre.
const corps = new THREE.Group();
{
  const invisible = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  const p = (geo, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, invisible); m.position.set(x, y, z); m.rotation.z = rz; m.castShadow = true; corps.add(m); return m; };
  p(new THREE.CapsuleGeometry(0.2, 0.62, 4, 12), 0, 1.05, 0);            // torse
  p(new THREE.SphereGeometry(0.13, 12, 10), 0, 1.6, 0);                  // tête
  p(new THREE.CapsuleGeometry(0.08, 0.7, 3, 8), -0.12, 0.42, 0);        // jambes
  p(new THREE.CapsuleGeometry(0.08, 0.7, 3, 8), 0.12, 0.42, 0);
  p(new THREE.CapsuleGeometry(0.06, 0.5, 3, 8), -0.27, 1.12, 0, 0.12);  // bras
  corps.userData.brasOutil = p(new THREE.CapsuleGeometry(0.06, 0.5, 3, 8), 0.3, 1.15, -0.15, -0.5);
  corps.userData.ombreOutil = p(new THREE.CylinderGeometry(0.02, 0.02, 1.1, 6), 0.45, 0.85, -0.5, -0.9);   // l'outil aussi a son ombre
}
scene.add(corps);
function majCorps() {
  const sb = Math.sin(joueur.pas), a = clamp(joueur.vitesse / VIT, 0, 1);
  corps.visible = !joueur.enVehicule;
  corps.position.set(joueur.x, joueur.y, joueur.z); corps.rotation.y = joueur.yaw;
  corps.children[2].rotation.x = sb * 0.5 * a; corps.children[3].rotation.x = -sb * 0.5 * a;   // les jambes marchent dans l'ombre
}

// L'outil en main occupe le bas de l'écran, en diagonale : le manche part du coin inférieur droit vers le centre gauche.
const vue = new THREE.Group(); vue.rotation.order = 'YXZ'; camera.add(vue); scene.add(camera);
const POSE_OUTIL = {   // position et orientation de chaque outil dans la caméra
  pinceau: { p: [0.2, -0.36, -0.5], r: [-1.05, 0.95, 0.15], s: 1.15 },
  brosse: { p: [0.36, -0.62, -0.6], r: [-1.2, 1.05, 0.12], s: 1.0 },
  large: { p: [0.42, -0.72, -0.65], r: [-1.25, 1.05, 0.1], s: 0.85 },
  xl: { p: [0.45, -0.8, -0.7], r: [-1.28, 1.05, 0.1], s: 0.72 },
  souffleur: { p: [0.26, -0.42, -0.55], r: [-1.25, 0.7, 0.1], s: 0.85 },
  marteau: { p: [0.24, -0.34, -0.5], r: [-0.7, 0.4, 0.2], s: 1.1 },
  tuyau: { p: [0.22, -0.32, -0.5], r: [-0.5, 0.3, 0.1], s: 1.0 },
};
const ENMAIN = {};
let outilEnMain = 'pinceau';
function prendre(cle) {
  outilEnMain = cle; vue.clear();
  if (!ENMAIN[cle]) { const o = fabriquerOutil(cle); o.traverse((m) => { if (m.isMesh) { m.castShadow = false; m.receiveShadow = false; } }); ENMAIN[cle] = o; }
  vue.add(ENMAIN[cle]);
  const P = POSE_OUTIL[cle]; ENMAIN[cle].scale.setScalar(P.s);
}
prendre('pinceau');
let geste = 0, gesteType = 'brosser';
function majVue(dt) {
  const P = POSE_OUTIL[outilEnMain], a = clamp(joueur.vitesse / VIT, 0, 1.3), sb = Math.sin(joueur.pas), cb = Math.abs(Math.cos(joueur.pas));
  geste = lerp(geste, E.action ? 1 : 0, 1 - Math.exp(-dt * 10));
  const t = gt * (gesteType === 'arracher' ? 16 : 8), balai = Math.sin(t) * 0.06 * geste, souffle = Math.sin(gt * 1.3) * 0.004;
  vue.visible = !joueur.enVehicule;
  vue.position.set(P.p[0] + sb * 0.016 * a - retardRegard * 0.3 + balai, P.p[1] - cb * 0.014 * a + souffle + retardRegardV * 0.25 + 0.03 * geste, P.p[2] - 0.05 * geste);
  vue.rotation.set(P.r[0] + sb * 0.03 * a + 0.12 * geste, P.r[1] + retardRegard + balai * 2, P.r[2] + (gesteType === 'arracher' ? Math.sin(t) * 0.15 * geste : 0));
}

// =====================================================================
// 99. Post-traitement, mise en page (paysage forcé sur téléphone), boucle de jeu
// =====================================================================
const cible = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: Q.msaa });
const composer = new EffectComposer(renderer, cible);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.35, 0.92); composer.addPass(bloom);   // discret : seuls le vert sève et le jaune ressortent
if (Q.vignette) composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec2 c = vUv - 0.5; gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb * (1.0 - smoothstep(0.3, 0.8, dot(c, c) * 1.4) * 0.14), 1.0); }' }));
composer.addPass(new OutputPass());
let LARG = innerWidth, HAUT = innerHeight;
function disposer() {
  tourne = MOBILE && innerHeight > innerWidth;
  LARG = tourne ? innerHeight : innerWidth; HAUT = tourne ? innerWidth : innerHeight;
  jeu.style.width = LARG + 'px'; jeu.style.height = HAUT + 'px';
  jeu.style.transform = tourne ? `translate(${innerWidth}px, 0) rotate(90deg)` : 'none';
  renderer.setPixelRatio(dpr); renderer.setSize(LARG, HAUT, false); composer.setPixelRatio(dpr); composer.setSize(LARG, HAUT);
  camera.aspect = LARG / HAUT; camera.fov = clamp(70 * Math.min(1, 1.78 / camera.aspect) ** 0.5, 58, 70); camera.updateProjectionMatrix();
}
disposer(); addEventListener('resize', disposer); addEventListener('orientationchange', () => setTimeout(disposer, 250));
const dbg = document.getElementById('debug'); if (DEBUG) dbg.hidden = false;
renderer.info.autoReset = false;
const MAJ = [];   // fonctions de mise à jour ajoutées par les modules (étapes 3 à 6)
function majMonde(dt) {
  gt += dt;
  majJoueur(dt); majCamera(); majCorps(); majVue(dt);
  for (const f of MAJ) f(dt);
  E.inter = false; E.outil = -1; E.construire = false; E.contrats = false; E.tourner = false;   // impulsions consommées
  const st = 0.03, sx = Math.round(joueur.x / st) * st, sz = Math.round(joueur.z / st) * st;   // l'ombre suit le joueur
  sun.target.position.set(sx, joueur.y, sz); sun.position.set(sx + SOLEIL.x * 60, joueur.y + SOLEIL.y * 60, sz + SOLEIL.z * 60); sun.target.updateMatrixWorld();
  ciel.position.copy(camera.position);
}
let dernier = performance.now();
function image(now) {
  requestAnimationFrame(image);
  const raw = (now - dernier) / 1000; dernier = now;
  if (!window.pollen.figer) majMonde(Math.min(0.05, Math.max(0, raw)));
  renderer.info.reset(); composer.render();
  if (DEBUG) dbg.textContent = `${Q.nom} · triangles ${(renderer.info.render.triangles / 1000).toFixed(0)} k · appels ${renderer.info.render.calls}\njoueur ${joueur.x.toFixed(1)} ${joueur.z.toFixed(1)}`;
}
window.pollen = {
  figer: false, Q, T, NT, CHARTE, scene, camera, renderer, machines, COLLECTEUR, joueur, E, OBSTACLES, vue, corps, H,
  get outil() { return outilEnMain; }, prendre,
  step(dt, n = 1) { for (let k = 0; k < n; k++) majMonde(dt); return { x: joueur.x, z: joueur.z, y: joueur.y, yaw: joueur.yaw, pitch: joueur.pitch, vitesse: joueur.vitesse }; },
};
OBSTACLES.push({ x: COLLECTEUR.position.x, z: COLLECTEUR.position.z, r: 1.7 });
majMonde(0);
requestAnimationFrame(image);

</script>
