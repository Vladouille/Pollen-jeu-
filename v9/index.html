<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe6f7">
<title>POLLEN station</title>
<!--
  POLLEN v9, étape 1 : le décor et la charte. Une station agricole propre à POLLEN :
  matériel manufacturé, arêtes chanfreinées, socles à gradins, rainures de panneaux,
  quatre couleurs pour tout le matériel (blanc cassé, graphite, jaune pollen, vert sève lumineux).
  Terrain hexagonal beige (sec) et vert (pollinisé), une machine (le collecteur), caméra libre.
  ?mode=pc ou ?mode=mobile pour forcer l'appareil, ?debug pour les compteurs.
-->
<style>
  :root { --encre: #fffdf7; --fond: #cfe6f7; color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; font: 700 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--encre); }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #debug { position: fixed; left: 10px; top: 10px; margin: 0; padding: 6px 9px; border-radius: 6px; background: rgba(0, 0, 0, .45); font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #panne { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; border-radius: 8px; background: rgba(47, 51, 56, .92); }
</style>
<script>
  function panne(m) { var p = document.getElementById('panne'); if (p) { p.hidden = false; p.textContent = m; } }
  window.addEventListener('error', function (e) { panne('Erreur : ' + (e.message || e.type)); });
</script>

</script>
</head>

// =====================================================================
// 5. Les matières et les briques de la charte
// =====================================================================

  placer(parent, boite(w + 0.74, 0.035, d + 0.74, M.seve, 0.015), 0, 0.17, 0);
  placer(parent, boite(w + 0.4, 0.2, d + 0.4, M.blanc, 0.04), 0, 0.29, 0);
  placer(parent, boite(w + 0.16, 0.1, d + 0.16, M.graphite, 0.03), 0, 0.44, 0);
  return 0.49;   // hauteur du dessus du socle
}
function ecran(texte) {   // verre sombre, chiffre en jaune pollen
  const t = texture(256, 128, (g, w, h) => { g.fillStyle = '#121518'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(244,180,26,.25)'; g.strokeRect(6, 6, w - 12, h - 12); g.fillStyle = '#f4b41a'; g.font = '800 64px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(texte, w / 2, h / 2 + 4); });
  return new THREE.MeshStandardMaterial({ color: 0x0d0f11, roughness: 0.1, metalness: 0.2, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 1.3 });
}
function bouton() {   // gros bouton rond jaune pollen en relief, sur une bague graphite
  const g = new THREE.Group();
  placer(g, new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.16, 0], [0.165, 0.02], [0.165, 0.05], [0.15, 0.06], [0, 0.06]].map(([r, y]) => new THREE.Vector2(r, y)), 32).rotateX(Math.PI / 2), M.graphite), 0, 0, 0);
  placer(g, new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.125, 0], [0.13, 0.03], [0.115, 0.075], [0.07, 0.1], [0, 0.105]].map(([r, y]) => new THREE.Vector2(r, y)), 32).rotateX(Math.PI / 2), M.pollen), 0, 0, 0.05);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

// =====================================================================
// 6. Le collecteur : on y videra le pollen. Socle étagé, corps à panneaux,
//    bandeau graphite, écran au chiffre jaune, gros bouton, fente d'insertion.
// =====================================================================
function collecteur() {
  const g = new THREE.Group(); g.userData.machine = 'collecteur';
  const W = 2.2, D = 1.6, base = socle(g, W, D);
  const corps = placer(g, boite(W, 1.9, D, [M.panneau, M.panneau, M.blanc, M.blanc, M.panneau, M.panneau], 0.04), 0, base + 0.95, 0);
  corps.userData.corps = true;
  placer(g, boite(W + 0.05, 0.24, D + 0.05, M.graphite, 0.035), 0, base + 0.2, 0);                // bandeau bas
  placer(g, boite(W - 0.25, 0.14, D - 0.25, M.blanc, 0.04), 0, base + 1.97, 0);                    // couvercle en retrait
  placer(g, boite(W - 0.18, 0.03, D - 0.18, M.graphite, 0.012), 0, base + 1.91, 0);                // joint du couvercle
  // Façade (+z) : écran, bouton, fente, voyants.
  const f = D / 2 + 0.005;
  placer(g, boite(0.9, 0.52, 0.06, M.graphite, 0.025), -0.35, base + 1.35, f + 0.02);              // cadre de l'écran
  placer(g, new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.42), ecran('0,0 kg')), -0.35, base + 1.35, f + 0.052);
  placer(g, bouton(), 0.6, base + 1.35, f + 0.01);
  placer(g, boite(1.3, 0.16, 0.05, M.graphite, 0.02), 0, base + 0.62, f + 0.015);                  // fente d'insertion
  placer(g, boite(1.24, 0.03, 0.03, M.seve, 0.01), 0, base + 0.74, f + 0.03);
  for (let k = 0; k < 3; k++) placer(g, boite(0.06, 0.06, 0.03, k === 0 ? M.seve : M.graphite, 0.012), 0.42 + k * 0.1, base + 1.67, f + 0.01);   // voyants
  // Poignées latérales graphite et pattes de fixation.
  for (const s of [-1, 1]) { placer(g, boite(0.06, 0.5, 0.08, M.graphite, 0.025), s * (W / 2 + 0.04), base + 1.2, 0.35); placer(g, boite(0.06, 0.5, 0.08, M.graphite, 0.025), s * (W / 2 + 0.04), base + 1.2, -0.35); }
  return g;
}
const COLLECTEUR = collecteur();
COLLECTEUR.position.set(2, H(2, -1), -1); COLLECTEUR.rotation.y = Math.atan2(SOLEIL.x, SOLEIL.z) - 0.5; scene.add(COLLECTEUR);   // façade éclairée par le soleil
machines.push(COLLECTEUR);

// =====================================================================
// 7. Post-traitement, caméra libre, boucle
// =====================================================================
const cible = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: Q.msaa });
const composer = new EffectComposer(renderer, cible);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.35, 0.92); composer.addPass(bloom);   // discret : seuls le vert sève et le jaune ressortent
if (Q.vignette) composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec2 c = vUv - 0.5; gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb * (1.0 - smoothstep(0.3, 0.8, dot(c, c) * 1.4) * 0.14), 1.0); }' }));
composer.addPass(new OutputPass());
const controles = new OrbitControls(camera, canvas);   // caméra libre (étape 1) : glisser pour tourner, molette ou pincement pour zoomer
controles.target.set(2, 1.4, -1); controles.enableDamping = true; controles.minDistance = 3; controles.maxDistance = 60; controles.maxPolarAngle = 1.48;
{ const a = Math.atan2(SOLEIL.x, SOLEIL.z) - 0.2; camera.position.set(2 + Math.sin(a) * 8, 2.4, -1 + Math.cos(a) * 8); } controles.update();
function disposer() {
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false); composer.setPixelRatio(dpr); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
disposer(); addEventListener('resize', disposer);
const dbg = document.getElementById('debug'); if (DEBUG) dbg.hidden = false;
renderer.info.autoReset = false;
function image() {
  requestAnimationFrame(image);
  controles.update();
  renderer.info.reset(); composer.render();
  if (DEBUG) dbg.textContent = `${Q.nom} · triangles ${(renderer.info.render.triangles / 1000).toFixed(0)} k · appels ${renderer.info.render.calls}\ntuiles ${NT} · vertes ${T.vert.reduce((s, v) => s + v, 0)}`;
}
window.pollen = { Q, T, NT, CHARTE, scene, camera, renderer, controles, machines, COLLECTEUR };
requestAnimationFrame(image);
</script>
