<script type="module">
// Version mobile : même jeu, qualité adaptée au téléphone.
const PLATEFORME = {
  nom: 'mobile',
  pixelRatioMax: 1.5,
  ombres: 1024,
  herbe: 60000,
  rayonHerbe: 30,
  rayonFleurs: 34,
  capFleurs: 2600,
  distance: 70,
  terrainSegments: 170,
  postComplet: false,       // bloom et vignette seulement
  reductionAuto: true,      // baisse la résolution si la fréquence tombe sous 50 img/s
};

// =====================================================================
// Contrôles mobiles : deux zones tactiles multipoint. Moitié gauche : un joystick
// qui naît là où le pouce se pose (zone morte 10 %, réponse quadratique, poussé à
// fond il fait courir). Moitié droite : on glisse le pouce pour regarder.
// Paysage obligatoire : à la verticale, écran « tourne ton téléphone » et pause.
// =====================================================================
function installerControles(E, canvas, demarrerAudio) {
  const style = document.createElement('style');
  style.textContent = `
    .pol-stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255,250,240,.55); background: rgba(30,26,16,.16); pointer-events: none; }
    .pol-stick b { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,250,240,.78); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .pol-rotate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #3a3424; color: #fffaf0; text-align: center; padding: 24px; font: 700 20px/1.3 "Trebuchet MS", system-ui, sans-serif; }
    .pol-rotate i { display: block; width: 46px; height: 78px; margin: 0 auto 20px; border: 4px solid #fffaf0; border-radius: 10px; animation: polTurn 2s ease-in-out infinite; }
    @keyframes polTurn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (prefers-reduced-motion: reduce) { .pol-rotate i { animation: none; transform: rotate(-90deg); } }`;
  document.head.appendChild(style);
  const stickEl = document.createElement('div'); stickEl.className = 'pol-stick'; stickEl.hidden = true; stickEl.innerHTML = '<b></b>';
  const rot = document.createElement('div'); rot.className = 'pol-rotate'; rot.hidden = true; rot.innerHTML = '<div><i></i>Tourne ton téléphone</div>';
  document.body.append(stickEl, rot);

  const R = 56;            // rayon du joystick, en pixels
  const SENS = 0.0058;     // regard : radians par pixel glissé
  let stick = null, regard = null, verrouTente = false;

  function majStick(x, y) {
    const len = Math.hypot(x, y);
    if (len < 0.1) { E.mx = 0; E.mz = 0; E.course = false; return; }
    const m = Math.pow((Math.min(len, 1) - 0.1) / 0.9, 2);
    E.mx = (x / len) * Math.max(0.2, m); E.mz = (-y / len) * Math.max(0.2, m);
    E.course = len > 0.95;
  }
  addEventListener('touchstart', (e) => {
    demarrerAudio();
    if (!verrouTente) { // Tentative de plein écran et de verrouillage en paysage ; refusée par certains navigateurs, sans gravité.
      verrouTente = true;
      const p = document.documentElement.requestFullscreen?.(); if (p && p.then) p.then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
    }
    if (E.pause) return;
    for (const t of e.changedTouches) {
      if (t.target.closest && t.target.closest('button')) continue; // les boutons d'action gèrent leurs propres touches
      if (t.clientX < innerWidth / 2 && !stick) {
        stick = { id: t.identifier, ox: t.clientX, oy: t.clientY };
        stickEl.hidden = false; stickEl.style.left = t.clientX + 'px'; stickEl.style.top = t.clientY + 'px'; stickEl.firstChild.style.transform = '';
      } else if (t.clientX >= innerWidth / 2 && !regard) {
        regard = { id: t.identifier, x: t.clientX, y: t.clientY };
      }
    }
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (stick && t.identifier === stick.id) {
        let x = (t.clientX - stick.ox) / R, y = (t.clientY - stick.oy) / R;
        const len = Math.hypot(x, y); if (len > 1) { x /= len; y /= len; }
        stickEl.firstChild.style.transform = `translate(${x * R}px, ${y * R}px)`;
        majStick(x, y);
      } else if (regard && t.identifier === regard.id) {
        const dx = t.clientX - regard.x, dy = t.clientY - regard.y;
        const acc = 1 + Math.min(Math.hypot(dx, dy), 30) / 30 * 0.5; // un geste vif tourne un peu plus
        E.dYaw += dx * SENS * acc; E.dPitch += dy * SENS * acc;
        regard.x = t.clientX; regard.y = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  function fin(e) {
    for (const t of e.changedTouches) {
      if (stick && t.identifier === stick.id) { stick = null; stickEl.hidden = true; majStick(0, 0); }
      if (regard && t.identifier === regard.id) regard = null;
    }
  }
  addEventListener('touchend', fin); addEventListener('touchcancel', fin);

  function orientation() {
    const portrait = innerHeight > innerWidth;
    rot.hidden = !portrait; E.pause = portrait;
    if (portrait) { stick = regard = null; stickEl.hidden = true; majStick(0, 0); }
  }
  addEventListener('resize', orientation);
  addEventListener('orientationchange', () => setTimeout(orientation, 200));
  orientation();
}

// =====================================================================
// POLLEN v5 — code de jeu commun aux versions PC et mobile.
// Étape 1 : le rendu. Terrain en relief, tuiles hexagonales, trois espèces
// instanciées, moitié fanée et moitié fleurie, vent, soleil, ombres, brume,
// post-traitement.
// Étape 2 : le joueur. Première personne, mains gantées, déplacement, collisions,
// relief suivi. Les contrôles (controles-pc.js / controles-mobile.js) remplissent
// l'objet d'entrée E ; tout le reste est commun aux deux fichiers.
// =====================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
// Réglages de la plateforme, avec des surcharges d'URL pour alléger une machine qui peine (?herbe=, ?rayon=, ?msaa=).
const Q = { ...PLATEFORME };
if (params.has('herbe')) Q.herbe = Math.max(1000, +params.get('herbe') || Q.herbe);
if (params.has('rayon')) Q.rayonFleurs = Math.max(8, +params.get('rayon') || Q.rayonFleurs);
Q.msaa = params.has('msaa') ? +params.get('msaa') : Q.nom === 'pc' ? 4 : 2;
if (Q.postComplet) Q.msaa = Math.max(2, Q.msaa); // la texture de profondeur lue par le flou exige une cible multi-échantillonnée
const DEBUG = params.has('debug');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mulberry = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const C = (h) => new THREE.Color(h);

// ---------------------------------------------------------------------
// Relief : somme d'ondes tournées (bruit fractal), même formule en JS et en GLSL
// ---------------------------------------------------------------------
function H(x, z) {
  let h = 0, a = 2.2, f = 0.012, px = x, pz = z;
  for (let o = 0; o < 6; o++) {
    h += a * Math.sin(px * f) * Math.cos(pz * f * 1.17 + o * 1.9);
    const nx = px * 0.8 - pz * 0.6, nz = px * 0.6 + pz * 0.8; px = nx + 31.7; pz = nz - 17.3; f *= 2.03; a *= 0.47;
  }

  return h + ss(140, 320, r) * (34 + 16 * Math.sin(Math.atan2(z, x) * 3 + 0.7));
}
const HEIGHT_GLSL = `
float terrainH(vec2 p) {
  float h = 0.0, a = 2.2, f = 0.012; vec2 q = p;
  for (int o = 0; o < 6; o++) {
    h += a * sin(q.x * f) * cos(q.y * f * 1.17 + float(o) * 1.9);
    q = vec2(q.x * 0.8 - q.y * 0.6 + 31.7, q.x * 0.6 + q.y * 0.8 - 17.3); f *= 2.03; a *= 0.47;
  }
  float r = length(p);
  return h + smoothstep(140.0, 320.0, r) * (34.0 + 16.0 * sin(atan(p.y, p.x) * 3.0 + 0.7));
}`;

// ---------------------------------------------------------------------
// Grille hexagonale (pointe en haut, coordonnées axiales)
// ---------------------------------------------------------------------
const HEX = 2.0, SQ3 = Math.sqrt(3), APO = HEX * SQ3 / 2;

function toHex(x, z) {
  const qf = (SQ3 / 3 * x - z / 3) / HEX, rf = (2 / 3 * z) / HEX, yf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf), y = Math.round(yf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), dy = Math.abs(y - yf);
  if (dq > dr && dq > dy) q = -r - y; else if (dy <= dr) r = -q - y;
  return [q, r];
}
const hexEdge = (dx, dz) => Math.max(Math.abs(dx), Math.abs(0.5 * dx + 0.866 * dz), Math.abs(-0.5 * dx + 0.866 * dz)) / APO;
const HEX_GLSL = `
uniform sampler2D uState;
vec2 hexOf(vec2 p) {
  float qf = (0.5773503 * p.x - 0.3333333 * p.y) / ${HEX.toFixed(1)}, rf = (0.6666667 * p.y) / ${HEX.toFixed(1)};
  vec3 c = vec3(qf, -qf - rf, rf); vec3 rc = floor(c + 0.5); vec3 d = abs(rc - c);
  if (d.x > d.y && d.x > d.z) rc.x = -rc.y - rc.z; else if (d.y > d.z) rc.y = -rc.x - rc.z; else rc.z = -rc.x - rc.y;
  return vec2(rc.x, rc.z);
}
vec2 hexC(vec2 h) { return vec2(${HEX.toFixed(1)} * 1.7320508 * (h.x + h.y * 0.5), ${HEX.toFixed(1)} * 1.5 * h.y); }
float hexEdge(vec2 d) { return max(abs(d.x), max(abs(0.5 * d.x + 0.866 * d.y), abs(-0.5 * d.x + 0.866 * d.y))) / ${APO.toFixed(4)}; }
vec4 tileAt(vec2 h) { vec2 uv = (h + ${OFF}.0 + 0.5) / ${NTEX}.0; return texture2D(uState, uv); }`;

// Espèces de l'étape 1 : trèfle, pissenlit, colza (silhouettes distinctes : boule, capitule, grappe).
const SPECIES = [
  { nom: 'trèfle', petal: 0xf4a6c6, dry: 0xa89a8c, heart: 0xfbe0ea, leaf: 0x4e8a2c, height: 0.24 },
  { nom: 'pissenlit', petal: 0xffc414, dry: 0xb0a07a, heart: 0xf2a400, leaf: 0x4a8a24, height: 0.3 },
  { nom: 'colza', petal: 0xffd820, dry: 0xb2a686, heart: 0xe8b000, leaf: 0x568f2a, height: 0.56 },
];
const NSP = SPECIES.length, NVAR = 5, FSCALE = 1.85;
const noiseSeed = mulberry(91);
const perm = new Uint8Array(512); const val = new Float32Array(256);
for (let i = 0; i < 256; i++) { perm[i] = i; val[i] = noiseSeed(); }
for (let i = 255; i > 0; i--) { const j = Math.floor(noiseSeed() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const v = (a, b) => val[perm[(a & 255) + perm[b & 255]]]; const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf); return lerp(lerp(v(xi, yi), v(xi + 1, yi), u), lerp(v(xi, yi + 1), v(xi + 1, yi + 1), u), w); }
const fbm = (x, y, o = 4) => { let a = 0.5, f = 1, s = 0, n = 0; for (let k = 0; k < o; k++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2; } return s / n; };
function speciesAt(x, z) { const n = fbm(x / 70 + 4, z / 70 - 2, 3) * 0.75 + vnoise(x / 18, z / 18) * 0.25; return clamp(Math.floor((n - 0.28) * 7), 0, NSP - 1); }

// Les tuiles sont de simples entrées dans des tableaux.
const T = { q: [], r: [], x: [], z: [], y: [], sp: [], bloom: [] };
const tileIdx = new Int32Array((2 * OFF + 1) ** 2).fill(-1);
const idxOf = (q, r) => (Math.abs(q) > OFF || Math.abs(r) > OFF) ? -1 : tileIdx[(q + OFF) * (2 * OFF + 1) + (r + OFF)];
for (let q = -OFF; q <= OFF; q++) for (let r = -OFF; r <= OFF; r++) {
  const [x, z] = hexCenter(q, r);
  if (Math.hypot(x, z) > MAP_R) continue;
  tileIdx[(q + OFF) * (2 * OFF + 1) + (r + OFF)] = T.q.length;
  T.q.push(q); T.r.push(r); T.x.push(x); T.z.push(z); T.y.push(H(x, z)); T.sp.push(speciesAt(x, z)); T.bloom.push(0);
}
const NT = T.q.length;
const bloomAt = new Float32Array(NT).fill(1e9); // instant de floraison ; 1e9 = fanée
const stateData = new Uint8Array(NTEX * NTEX * 4);
const stateTex = new THREE.DataTexture(stateData, NTEX, NTEX, THREE.RGBAFormat);
stateTex.magFilter = stateTex.minFilter = THREE.NearestFilter;
function writeTile(i) { const k = ((T.r[i] + OFF) * NTEX + (T.q[i] + OFF)) * 4; stateData[k] = T.bloom[i] ? 255 : 0; stateData[k + 1] = T.sp[i] * 80; stateData[k + 3] = 255; }
function bloomTile(i, when) { if (T.bloom[i]) return; T.bloom[i] = 1; bloomAt[i] = when; writeTile(i); stateTex.needsUpdate = true; refreshTile(i); }

// ---------------------------------------------------------------------
// Rendu
// ---------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, Q.pixelRatioMax);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const HORIZON = C(0xf2cc9c);
// La brume ferme la vue à la distance d'affichage choisie pour la plateforme.
scene.fog = new THREE.FogExp2(HORIZON, 2.0 / Q.distance);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.04, 1200);
scene.add(camera);

// Lumière rasante : soleil à 25°, chaud, intensité 2,5 ; hémisphère 0,6.
const SUN_DIR = V(Math.cos(0.9) * Math.cos(0.436), Math.sin(0.436), Math.sin(0.9) * Math.cos(0.436)).normalize();
const sun = new THREE.DirectionalLight(0xffc690, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.ombres, Q.ombres);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
const SH = Q.nom === 'pc' ? 34 : 24;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 220 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xb6d2ec, 0x6e5a38, 0.6));

// Ciel en dégradé, soleil et halo.
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uZen: { value: C(0x5a8ccc) }, uMid: { value: C(0xa9c7e4) }, uHor: { value: HORIZON }, uSun: { value: SUN_DIR }, uSunCol: { value: C(0xffb468) } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }',
  fragmentShader: `uniform vec3 uZen, uMid, uHor, uSun, uSunCol; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(uMid, uZen, smoothstep(0.08, 0.7, h)); col = mix(uHor, col, smoothstep(-0.02, 0.24, h)); col = mix(col, uHor * 0.92, smoothstep(0.0, -0.3, h));
      float s = max(dot(d, uSun), 0.0); col += uSunCol * (pow(s, 1000.0) * 6.0 + pow(s, 40.0) * 0.45 + pow(s, 5.0) * 0.28 * (1.0 - smoothstep(0.0, 0.5, h)));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

// ---------------------------------------------------------------------
// Textures : toute matière reçoit un bruit et une carte de normales dérivée du même bruit
// ---------------------------------------------------------------------
function texFrom(w, h, fn, srgb = true, repeat = 1) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = fn(x, y), i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function normalFrom(w, h, hf, k, repeat = 1) {
  const Hm = new Float32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) Hm[y * w + x] = hf(x, y);
  return texFrom(w, h, (x, y) => { const nx = (Hm[y * w + (x + w - 1) % w] - Hm[y * w + (x + 1) % w]) * k, ny = (Hm[((y + h - 1) % h) * w + x] - Hm[((y + 1) % h) * w + x]) * k, L = Math.hypot(nx, ny, 1); return [(nx / L * 0.5 + 0.5) * 255, (ny / L * 0.5 + 0.5) * 255, (0.5 / L + 0.5) * 255]; }, false, repeat);
}
// Sol : grain fin, mottes, petits cailloux. Périodique sur 256 px.
const soilH = (x, y) => fbm(x / 16, y / 16, 4) * 0.8 + 0.2 * Math.pow(vnoise(x / 3, y / 3), 6) * 3;
const soilTex = texFrom(256, 256, (x, y) => { const v = (0.7 + 0.3 * soilH(x, y) + (Math.random() - 0.5) * 0.06) * 255; return [v, v * 0.97, v * 0.92]; }, true, 70);
const soilNormal = normalFrom(256, 256, soilH, 1.6, 70);

// ---------------------------------------------------------------------
// Terrain : couleur selon pente et altitude, puis état de chaque tuile (fanée ou fleurie)
// ---------------------------------------------------------------------
const stateU = { uState: { value: stateTex }, uLush: { value: SPECIES.map((s) => C(0x4f8a26).lerp(C(s.petal), 0.16)) } }; // vert franc, à peine teinté par l'espèce
{
  const size = 660, seg = Q.terrainSegments;
  const g = new THREE.PlaneGeometry(size, size, seg, seg).rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, H(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const n = g.attributes.normal, col = new Float32Array(p.count * 3), c = new THREE.Color();
  const rock = C(0x9a9284), crest = C(0xb8ad98), base = C(0xffffff);
  for (let i = 0; i < p.count; i++) {
    const slope = 1 - n.getY(i), y = p.getY(i);
    c.copy(base).lerp(rock, ss(0.12, 0.3, slope) * 0.8).lerp(crest, ss(16, 32, y) * 0.6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, map: soilTex, normalMap: soilNormal, normalScale: new THREE.Vector2(0.4, 0.4), roughness: 0.95 });

  player.yaw -= dYaw; player.pitch = clamp(player.pitch - dPitch, -1.45, 1.4);
  // Les mains traînent un peu derrière le regard.
  lookSway = lerp(lookSway, clamp(dYaw * 4, -0.1, 0.1), 1 - Math.exp(-dt * 12));
  lookSwayP = lerp(lookSwayP, clamp(dPitch * 4, -0.08, 0.08), 1 - Math.exp(-dt * 12));
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
  let mx = E.mx, mz = E.mz; const m = Math.hypot(mx, mz); if (m > 1) { mx /= m; mz /= m; }
  const sp = E.course ? RUN : WALK, k = 1 - Math.exp(-dt * 9);
  player.vx = lerp(player.vx, (fx * mz + rx * mx) * sp, k); player.vz = lerp(player.vz, (fz * mz + rz * mx) * sp, k);
  let nx = player.x + player.vx * dt, nz = player.z + player.vz * dt;
  if (!climbable(nx, nz)) { // trop raide : on glisse le long de la pente si possible
    if (climbable(nx, player.z)) nz = player.z; else if (climbable(player.x, nz)) nx = player.x; else { nx = player.x; nz = player.z; player.vx *= 0.3; player.vz *= 0.3; }
  }
  const p = { x: nx, z: nz }; collide(p); player.x = p.x; player.z = p.z;
  player.y = lerp(player.y, H(player.x, player.z), 1 - Math.exp(-dt * 16));
  player.speed = Math.hypot(player.vx, player.vz);
  if (player.speed > 0.3) {
    const before = player.bob; player.bob += dt * player.speed * 1.75;
    if (Math.floor(before / Math.PI) !== Math.floor(player.bob / Math.PI)) { const [q, r] = toHex(player.x, player.z), i = idxOf(q, r); audio.pas(!(i >= 0 && T.bloom[i])); }
  } else player.bob = lerp(player.bob, Math.round(player.bob / Math.PI) * Math.PI, 1 - Math.exp(-dt * 6));
}
function updateCamera() {
  const a = clamp(player.speed / WALK, 0, 1.6), sb = Math.sin(player.bob);
  camera.position.set(player.x + Math.cos(player.yaw) * sb * 0.02 * a, player.y + player.eye + Math.abs(sb) * 0.045 * a - 0.02 * a, player.z - Math.sin(player.yaw) * sb * 0.02 * a);
  camera.rotation.set(player.pitch, player.yaw, sb * 0.006 * a, 'YXZ');
  camera.updateMatrixWorld();
}
function updateHands(time) {
  const a = clamp(player.speed / WALK, 0, 1.6), sb = Math.sin(player.bob), cb = Math.abs(Math.cos(player.bob));
  const breathe = Math.sin(time * 1.4) * 0.004, breathe2 = Math.sin(time * 1.4 + 1.1) * 0.004;
  // À la marche, les deux mains se balancent à contretemps ; à l'arrêt, elles respirent.
  handR.position.set(HAND_R.x + sb * 0.014 * a - lookSway * 0.3, HAND_R.y - cb * 0.012 * a + breathe + lookSwayP * 0.25, HAND_R.z);
  handR.rotation.set(HAND_R.rx + sb * 0.04 * a, HAND_R.ry + lookSway, -lookSway * 0.5);
  handL.position.set(HAND_L.x - sb * 0.012 * a - lookSway * 0.3, HAND_L.y - (1 - cb) * 0.012 * a + breathe2 + lookSwayP * 0.25, HAND_L.z);
  handL.rotation.set(HAND_L.rx - sb * 0.04 * a, HAND_L.ry + lookSway, -lookSway * 0.5);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); finish.uniforms.uRes.value.set(innerWidth, innerHeight);
});

// ---------------------------------------------------------------------
// Départ : la moitié de la vallée fleurie, l'autre fanée, une frontière qui serpente.
// ---------------------------------------------------------------------
for (let i = 0; i < NT; i++) { writeTile(i); if (T.x[i] * 0.8 + T.z[i] * 0.6 + Math.sin(T.z[i] * 0.06) * 7 + Math.sin(T.x[i] * 0.11) * 3 > 0) { T.bloom[i] = 1; bloomAt[i] = -100; writeTile(i); } }
stateTex.needsUpdate = true;

// Réduction automatique (mobile) : résolution, puis densité, si la fréquence tombe sous 50 img/s.
let fps = 60, acc = 0, frames = 0, checks = 0;
function perf(raw) {
  acc += raw; frames++;
  if (acc < 2) return;
  fps = frames / acc; acc = 0; frames = 0; checks++;
  if (!Q.reductionAuto || checks < 2 || fps >= 50) return;
  if (pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight); composer.setPixelRatio(pixelRatio); composer.setSize(innerWidth, innerHeight); }
  else if (grass.count > Q.herbe / 2) grass.count = Math.floor(Q.herbe / 2);
}

const dbg = document.getElementById('debug');
if (DEBUG) dbg.hidden = false;
let last = performance.now(), beeT = 0;
function frame(now) {
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  const time = now / 1000;
  perf(raw);
  if (!E.pause) updatePlayer(dt);
  updateCamera();
  updateHands(time);
  windU.uTime.value = time; windU.uCenter.value.set(camera.position.x, camera.position.z); windU.uPlayer.value.set(player.x, player.z);
  if (Math.hypot(player.x - builtAt[0], player.z - builtAt[1]) > 3) rebuild(player.x, player.z);
  if ((beeT -= dt) <= 0) { beeT = 2; assignBees(player.x, player.z); }
  updateBees(time); updateMotes(time, player.x, player.z);
  // Ombres serrées autour du joueur et déplacées avec lui.
  const st = (SH * 2) / Q.ombres, sx = Math.round(player.x / st) * st, sz = Math.round(player.z / st) * st, sy = H(sx, sz);
  sun.target.position.set(sx, sy, sz); sun.position.set(sx + SUN_DIR.x * 100, sy + SUN_DIR.y * 100, sz + SUN_DIR.z * 100);
  sky.position.copy(camera.position);
  if (DEBUG) dbg.textContent = `${Q.nom} · ${fps.toFixed(0)} img/s · ratio ${pixelRatio}\nfleurs ${meshes.flat().reduce((s, m) => s + m.count, 0)} · herbe ${grass.count}\njoueur ${player.x.toFixed(1)} ${player.z.toFixed(1)} · ${player.speed.toFixed(1)} m/s`;
  if (params.has('brut')) renderer.render(scene, camera); else composer.render();
  requestAnimationFrame(frame);
}
rebuild(player.x, player.z); assignBees(player.x, player.z);
requestAnimationFrame(frame);

// Pour les tests : avancer la simulation du joueur sans attendre l'affichage (le rendu logiciel tourne à 1 img/s).
const step = (dt, n = 1) => { for (let k = 0; k < n; k++) if (!E.pause) updatePlayer(dt); updateCamera(); return { x: player.x, z: player.z, y: player.y, yaw: player.yaw, pitch: player.pitch, speed: player.speed }; };
window.pollen = { Q, T, H, toHex, idxOf, bloomTile, scene, renderer, composer, camera, grass, meshes, sky, player, E, colliders, handR, handL, step, flowers: () => meshes.flat().reduce((s, m) => s + m.count, 0), fps: () => fps };

</script>
