<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9b98e">
<title>POLLEN</title>
<style>
  :root {
    --ink: #fffaf0;
    --shade: rgba(28, 24, 14, 0.5);
    --gold: #ffd25a;
    --gold-deep: #e7a923;
    --pill: rgba(34, 30, 20, 0.45);
    --bad: #ff7a5c;
    --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9b98e; overscroll-behavior: none; }
  body { font: 15px/1.3 var(--font); color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px var(--shade); }

  #credits {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px; background: var(--pill);
    font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  #credits i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 45%, var(--gold-deep)); }

  #reticle { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); transition: transform .12s; }
  #reticle.on { transform: scale(1.6); background: var(--gold); }
  #label { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: var(--pill); font-weight: 700; white-space: nowrap; }
  #label kbd { font: inherit; padding: 0 7px; border-radius: 6px; background: var(--ink); color: #2a2618; text-shadow: none; }
  #label .sub { font-weight: 400; opacity: .85; }
  #label.bad { color: var(--bad); }

  #bar {
    position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 7px 16px; border-radius: 999px; background: var(--pill); white-space: nowrap; font-weight: 700;
  }
  #tank { position: relative; width: 120px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.35); overflow: hidden; box-shadow: inset 0 0 0 1.5px rgba(255,250,240,.6); }
  #tankFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ffe07a, var(--gold-deep)); transition: width .2s; }
  #bar.full #tankFill { background: linear-gradient(90deg, #ffb070, var(--bad)); }
  #tankN { font-variant-numeric: tabular-nums; min-width: 46px; }
  #gain { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: 44px; font-weight: 800; color: var(--gold); opacity: 0; }
  #gain.show { animation: gain 1.3s ease-out forwards; }
  @keyframes gain { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.08); } 45% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-30px); } }
  #banner { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-size: 26px; font-weight: 700; opacity: 0; }
  #banner.show { animation: banner 2.8s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

  /* Panneau d'une station (hangar à outils) */
  #panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 16, 8, .45); pointer-events: auto; z-index: 10; }
  #panel .card { width: min(560px, 100%); max-height: 100%; overflow: auto; border-radius: 16px; padding: 18px; background: #f4ead2; color: #2a2618; text-shadow: none; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #panel h2 { margin: 0 0 4px; font-size: 22px; }
  #panel p.sub { margin: 0 0 14px; color: #6b5d40; }
  #panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #panel li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 12px; border-radius: 12px; background: #fffaf0; }
  #panel li.locked { opacity: .55; }
  #panel li b { font-size: 16px; }
  #panel li span { grid-column: 1; font-size: 13px; color: #6b5d40; }
  #panel li button { grid-row: 1 / span 2; grid-column: 2; font: 700 14px var(--font); border: 0; border-radius: 999px; padding: 10px 16px; background: var(--gold); color: #2a2618; cursor: pointer; }
  #panel li button:disabled { background: #ddd2b8; color: #8a7d60; cursor: default; }
  #panel li.owned button { background: #b9d98a; }
  #panel .close { margin-top: 14px; width: 100%; font: 700 15px var(--font); border: 0; border-radius: 12px; padding: 12px; background: #2a2618; color: var(--ink); cursor: pointer; }
  #panel button:focus-visible { outline: 3px solid #2a2618; outline-offset: 2px; }

  .touch-ui { position: fixed; inset: 0; pointer-events: none; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,250,240,.55); background: rgba(30,26,16,.18); }
  .stick b { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,250,240,.75); }
  .tbtn { position: absolute; pointer-events: auto; border: 0; touch-action: none; display: grid; place-items: center; font: 700 14px/1.15 var(--font); color: #2a2618; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  #act { right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff3c4, var(--gold) 55%, var(--gold-deep)); }
  #act.down { transform: scale(.93); }
  #use { left: calc(50% + 90px); top: calc(50% - 26px); min-width: 64px; height: 52px; padding: 0 16px; border-radius: 26px; background: var(--ink); }
  #place { right: calc(140px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; border-radius: 50%; background: #b9d98a; }

  #rotate { position: fixed; inset: 0; display: grid; place-items: center; background: #3a3424; color: var(--ink); text-align: center; padding: 24px; z-index: 30; }
  #rotate .phone { width: 46px; height: 78px; margin: 0 auto 20px; border: 4px solid var(--ink); border-radius: 10px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate p { margin: 0; font-size: 20px; font-weight: 700; }
  #debug { position: absolute; top: 10px; left: 10px; margin: 0; padding: 6px 9px; border-radius: 6px; background: rgba(0,0,0,.45); font: 12px/1.35 ui-monospace, monospace; white-space: pre; }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>

<body>
<canvas id="c" aria-label="POLLEN, la vallée"></canvas>

<div class="hud" id="hud">
  <div id="credits"><i></i><span id="creditsVal">0</span></div>
  <div id="reticle"></div>
  <div id="label" hidden></div>

  <div id="banner"></div>

    <span id="toolName">Tige de coton</span>

    <span id="tankN">0/12</span>
  </div>

</div>

<div class="touch-ui" id="touchUi" hidden>
  <div class="stick" id="stickL" hidden><b></b></div>
  <button class="tbtn" id="use" type="button" hidden></button>
  <button class="tbtn" id="place" type="button" hidden>Poser</button>
  <button class="tbtn" id="act" type="button" aria-label="Polliniser (maintenir)">Polliniser</button>
</div>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div class="card">
  <h2 id="panelTitle">Hangar à outils</h2>
  <p class="sub" id="panelSub"></p>
  <ul id="panelList"></ul>
  <button class="close" id="panelClose" type="button">Fermer</button>
</div></div>

<div id="rotate" hidden><div><div class="phone"></div><p>Tourne ton téléphone</p></div></div>

<script type="module">
import * as THREE from 'three';

// =====================================================================
// POLLEN v4 : première personne, vallée pavée d'hexagones fanés qui
// explosent de couleur quand on les pollinise. Ruchettes posées par le
// joueur, base avec hangar à outils et comptoir de vente.
// =====================================================================

const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');
const SCENE = params.get('scene') || 'jeu'; // 'grille' : étape 1 du brief, caméra libre, sans joueur
const SAVE_KEY = 'pollen-v4';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rng = mulberry32(404);
const rand = (a, b) => a + (b - a) * rng();
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const C = (h) => new THREE.Color(h);

// ---------- Réglages (le début est laborieux exprès) ----------
const TOOLS = [
  { id: 'coton', name: 'Tige de coton', time: 3.0, tank: 12, price: 0, desc: '3 s par tuile' },
  { id: 'pinceau', name: 'Pinceau', time: 1.1, tank: 30, price: 300, desc: '1 s par tuile, réservoir de 30' },
  { id: 'plumeau', name: 'Plumeau sur perche', time: 0.8, tank: 60, price: 1800, desc: 'Plusieurs tuiles d’un geste', locked: true },
  { id: 'souffleur', name: 'Souffleur à dos', time: 0.5, tank: 120, price: 12000, desc: 'On pollinise en marchant', locked: true },
  { id: 'pulve', name: 'Pulvérisateur', time: 0.3, tank: 400, price: 70000, desc: 'Une région en un passage', locked: true },
  { id: 'drones', name: 'Essaim de drones', time: 0.1, tank: 9999, price: 400000, desc: 'On ne pollinise plus, on gère', locked: true },
];
const RUCHETTE = { price: 40, capacity: 60, drain: 2.5 }; // pollen/s envoyé vers la base
const PRICE_POLLEN = 1;
const REACH = 6.5;

// =====================================================================
// La grille hexagonale (pointe en haut, coordonnées axiales q, r)
// =====================================================================
const HEX = 2.0;                   // du centre à un sommet : 2 m de côté
const SQ3 = Math.sqrt(3);
const MAP_R = 160;                  // rayon de la vallée pavée
const OFF = 60, NTEX = 128;         // décalage des coordonnées dans la texture d'état
const hexCenter = (q, r) => ({ x: HEX * SQ3 * (q + r / 2), z: HEX * 1.5 * r });
function toHex(x, z) {
  const qf = (SQ3 / 3 * x - z / 3) / HEX, rf = (2 / 3 * z) / HEX;
  let cx = qf, cz = rf, cy = -cx - cz;
  let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
  const dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return { q: rx, r: rz };
}
// Distance normalisée au bord de l'hexagone (0 au centre, 1 sur le bord).
const APO = HEX * SQ3 / 2;
function hexEdge(dx, dz) { return Math.max(Math.abs(dx), Math.abs(0.5 * dx + 0.866 * dz), Math.abs(-0.5 * dx + 0.866 * dz)) / APO; }

// Relief doux (même formule en GLSL inutile : le terrain est un maillage, les fleurs reçoivent leur hauteur du CPU).
function H(x, z) {
  let h = 0, a = 1.0, f = 0.03, px = x, pz = z;
  for (let o = 0; o < 4; o++) { h += a * Math.sin(px * f) * Math.cos(pz * f * 1.13 + o * 1.7); const nx = px * 0.8 - pz * 0.6, nz = px * 0.6 + pz * 0.8; px = nx + 17.3; pz = nz - 9.1; f *= 1.95; a *= 0.45; }
  const r = Math.hypot(x, z);
  return h * (0.9 + 1.6 * ss(30, 120, r)) * (1 - 0.8 * (1 - ss(6, 16, r))) + ss(150, 230, r) * 26;
}

// Bruit de valeur pour les régions d'espèces et les textures.
function valueNoise(seed) {
  const r = mulberry32(seed), N = 256, perm = new Uint8Array(512), val = new Float32Array(N);
  for (let i = 0; i < N; i++) { perm[i] = i; val[i] = r(); }
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < N; i++) perm[i + N] = perm[i];
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const v = (a, b) => val[perm[(a & 255) + perm[b & 255]]]; return lerp(lerp(v(xi, yi), v(xi + 1, yi), s(xf)), lerp(v(xi, yi + 1), v(xi + 1, yi + 1), s(xf)), s(yf)); };
}
const noiseA = valueNoise(7), noiseB = valueNoise(21);
const fbm = (x, y, oct = 3) => { let a = 0.5, f = 1, s = 0, n = 0; for (let o = 0; o < oct; o++) { s += a * noiseA(x * f, y * f); n += a; a *= 0.5; f *= 2; } return s / n; };

// Les cinq espèces : lavande, colza, tournesol, trèfle, bruyère.
const SPECIES = [
  { name: 'lavande', petal: 0x8a5cd6, dry: 0x9a8f80, heart: 0x6a3ab0, ground: 0x6f7a3a, height: 0.55 },
  { name: 'colza', petal: 0xffd21e, dry: 0xb3a682, heart: 0xf0b000, ground: 0x7d8f2a, height: 0.7 },
  { name: 'tournesol', petal: 0xffb400, dry: 0xa8946e, heart: 0x5a3012, ground: 0x6a8a26, height: 1.15 },
  { name: 'trèfle', petal: 0xf07aa8, dry: 0xb0a090, heart: 0xffffff, ground: 0x4f8a2a, height: 0.28 },
  { name: 'bruyère', petal: 0xd04a9a, dry: 0x9e8a86, heart: 0xa8306e, ground: 0x6a6a30, height: 0.38 },
];
function speciesAt(x, z) {
  if (Math.hypot(x, z) < 26) return 1; // autour de la base : du colza
  const n = noiseB(x / 55 + 3, z / 55 - 7) * 0.7 + noiseB(x / 19, z / 19) * 0.3;
  return clamp(Math.floor(n * 5.6 - 0.3), 0, 4);
}

// Les tuiles : de simples entrées dans des tableaux.
const tiles = { q: [], r: [], x: [], z: [], y: [], sp: [], bloom: [], prog: [] };
const tileIndex = new Int32Array((2 * OFF + 1) * (2 * OFF + 1)).fill(-1);
const idxOf = (q, r) => (Math.abs(q) > OFF || Math.abs(r) > OFF) ? -1 : tileIndex[(q + OFF) * (2 * OFF + 1) + (r + OFF)];
for (let q = -OFF; q <= OFF; q++) for (let r = -OFF; r <= OFF; r++) {
  const { x, z } = hexCenter(q, r);
  if (Math.hypot(x, z) > MAP_R) continue;
  const i = tiles.q.length;
  tileIndex[(q + OFF) * (2 * OFF + 1) + (r + OFF)] = i;
  tiles.q.push(q); tiles.r.push(r); tiles.x.push(x); tiles.z.push(z); tiles.y.push(H(x, z));
  tiles.sp.push(speciesAt(x, z));
  tiles.bloom.push(0); tiles.prog.push(0);
}
const NT = tiles.q.length;
const bloomT = new Float32Array(NT).fill(1e9); // instant de floraison (1e9 = fanée)
// Texture d'état lue par le terrain : R = fleurie, G = espèce, A = tuile existante.
const stateData = new Uint8Array(NTEX * NTEX * 4);
const stateTex = new THREE.DataTexture(stateData, NTEX, NTEX, THREE.RGBAFormat);
stateTex.magFilter = stateTex.minFilter = THREE.NearestFilter;
function writeState(i) {
  const k = ((tiles.r[i] + OFF) * NTEX + (tiles.q[i] + OFF)) * 4;
  stateData[k] = tiles.bloom[i] ? 255 : 0; stateData[k + 1] = tiles.sp[i] * 50; stateData[k + 3] = 255;
}
for (let i = 0; i < NT; i++) writeState(i);

// =====================================================================
// Rendu
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const HORIZON = C(0xf0c896);
scene.fog = new THREE.FogExp2(HORIZON, 0.014);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.04, 1500);
scene.add(camera);

// Lumière rasante : soleil bas et chaud à 25°, hémisphère pour remplir les ombres.
const SUN_DIR = V(Math.cos(0.6) * Math.cos(0.436), Math.sin(0.436), Math.sin(0.6) * Math.cos(0.436)).normalize();
const sun = new THREE.DirectionalLight(0xffc68a, 2.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 200 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xa9c8e6, 0x6e5c3c, 0.75));

// ---------- Ciel de fin d'après-midi ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uZen: { value: C(0x4f86c8) }, uMid: { value: C(0xa9c6e2) }, uHor: { value: HORIZON }, uSun: { value: SUN_DIR }, uSunCol: { value: C(0xffb468) } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }',
  fragmentShader: `uniform vec3 uZen, uMid, uHor, uSun, uSunCol; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(uMid, uZen, smoothstep(0.1, 0.7, h)); col = mix(uHor, col, smoothstep(-0.02, 0.25, h)); col = mix(col, uHor * 0.9, smoothstep(0.0, -0.3, h));
      float s = max(dot(d, uSun), 0.0); col += uSunCol * (pow(s, 900.0) * 5.0 + pow(s, 40.0) * 0.5 + pow(s, 6.0) * 0.25 * (1.0 - smoothstep(0.0, 0.5, h)));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);

// ---------- Textures générées ----------
function canvasTex(w, h, paint, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  paint(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function pixels(g, w, h, fn) { const img = g.createImageData(w, h), d = img.data; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = fn(x, y), i = (y * w + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3] ?? 255; } g.putImageData(img, 0, 0); }
const grainTex = canvasTex(256, 256, (g, w, h) => pixels(g, w, h, (x, y) => { const v = (0.78 + 0.22 * fbm(x / 20, y / 20, 3) + (Math.random() - 0.5) * 0.1) * 255; return [v, v, v]; }));
grainTex.repeat.set(60, 60);
function woodTex(base, seed = 1) { return canvasTex(128, 128, (g, w, h) => pixels(g, w, h, (x, y) => { const v = 0.8 + 0.1 * Math.sin(y * 0.32 + fbm(x / 9 + seed, y / 40) * 9) + 0.12 * fbm(x / 4, y / 24, 2) + (Math.random() - 0.5) * 0.06; return [base[0] * v, base[1] * v, base[2] * v]; })); }
const woodWarm = woodTex([168, 120, 76], 1), woodGrey = woodTex([176, 158, 134], 3), woodDark = woodTex([112, 80, 52], 5);
const metalTex = canvasTex(64, 64, (g, w, h) => pixels(g, w, h, (x, y) => { const v = (0.78 + 0.22 * fbm(x / 5, y / 5) + (Math.random() - 0.5) * 0.08) * 215; return [v, v, v * 1.02]; }));

const audio = (() => {
  let ctx = null, master = null, n = 0, hum = null;
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  function noise(sec) { const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    const src = ctx.createBufferSource(); src.buffer = noise(4); src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    const g = ctx.createGain(); g.gain.value = 0.045; src.connect(f).connect(g).connect(master); src.start();
    // Bourdonnement qui monte avec le nombre d'abeilles.
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 210; const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 420; bf.Q.value = 3;
    hum = ctx.createGain(); hum.gain.value = 0; o.connect(bf).connect(hum).connect(master); o.start();
  }
  function tone(fr, t, dur, type = 'sine', gain = 0.2, slide = 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(fr, t); if (slide) o.frequency.exponentialRampToValueAtTime(fr * slide, t + dur); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05); }
  function hiss(t, dur, freq, gain) { const s = ctx.createBufferSource(); s.buffer = noise(dur + 0.1); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f).connect(g).connect(master); s.start(t); }
  const on = (fn) => (...a) => { if (ctx) fn(ctx.currentTime, ...a); };
  return {
    init,
    bloom: on((t) => { const s = PENTA[(n++ * 3 + Math.floor(Math.random() * 3)) % PENTA.length], f = 392 * 2 ** (s / 12); tone(f, t, 0.5, 'triangle', 0.16); tone(f * 1.5, t + 0.05, 0.45, 'sine', 0.09); tone(f * 2, t + 0.1, 0.5, 'sine', 0.06); hiss(t, 0.4, 2400, 0.06); }),
    brush: on((t, k) => hiss(t, 0.09, 1500 + k * 1500, 0.025)),
    full: on((t) => { tone(220, t, 0.15, 'square', 0.05); tone(196, t + 0.15, 0.2, 'square', 0.05); }),
    pour: on((t) => { hiss(t, 0.6, 700, 0.1); tone(300, t, 0.4, 'sine', 0.06, 1.6); }),
    coins: on((t) => { for (let k = 0; k < 6; k++) tone(1800 + Math.random() * 900, t + k * 0.07, 0.12, 'triangle', 0.07); }),
    buy: on((t) => { [0, 4, 7, 12, 16, 19, 24].forEach((s, k) => tone(392 * 2 ** (s / 12), t + k * 0.08, 0.5, 'triangle', 0.13)); }),
    place: on((t) => { tone(140, t, 0.2, 'sine', 0.25, 0.6); hiss(t, 0.15, 400, 0.1); }),
    denied: on((t) => tone(180, t, 0.1, 'square', 0.035)),
    step: on((t) => hiss(t, 0.05, 600 + Math.random() * 300, 0.02)),
    setHum: (v) => { if (hum) hum.gain.setTargetAtTime(v, ctx.currentTime, 0.4); },
  };
})();

const state = { credits: 0, tank: 0, tool: 0, owned: [true, false, false, false, false, false], stock: 0, carrying: false, ruchettesBought: 0, bloomed: 0, elapsed: 0, firstSale: null };
const ruchettes = []; // {x, z, y, fill, group}
function bloomTile(i, now, silent) {
  if (tiles.bloom[i]) return;
  tiles.bloom[i] = 1; bloomT[i] = silent ? -100 : now; state.bloomed++;
  writeState(i); stateTex.needsUpdate = true; refreshTileFlowers(i);
}
function encodeBloom() { let s = ''; for (let i = 0; i < NT; i += 6) { let v = 0; for (let k = 0; k < 6; k++) if (tiles.bloom[i + k]) v |= 1 << k; s += String.fromCharCode(48 + v); } return s; }
function save() {
  if (SCENE === 'grille') return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, credits: state.credits, tank: state.tank, tool: state.tool, owned: state.owned, stock: state.stock, carrying: state.carrying, bloom: encodeBloom(), ruchettes: ruchettes.map((r) => [r.x, r.z, Math.round(r.fill)]), player: [player.x, player.z, player.yaw] })); } catch { /* stockage indisponible */ }
}
function load() {
  if (params.has('neuf') || SCENE === 'grille') return false;
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s || s.v !== 1) return false;
    Object.assign(state, { credits: s.credits | 0, tank: s.tank | 0, tool: clamp(s.tool | 0, 0, 1), stock: s.stock | 0, carrying: !!s.carrying });
    if (Array.isArray(s.owned)) state.owned = s.owned.map(Boolean);
    if (typeof s.bloom === 'string') for (let c = 0; c < s.bloom.length; c++) { const v = s.bloom.charCodeAt(c) - 48; for (let k = 0; k < 6; k++) if (v & (1 << k) && c * 6 + k < NT) bloomTile(c * 6 + k, 0, true); }
    for (const [x, z, f] of s.ruchettes || []) placeRuchette(x, z, f, true);
    if (s.player) { player.x = s.player[0]; player.z = s.player[1]; player.yaw = s.player[2]; }
    return true;
  } catch { return false; }
}
function placeRuchette(x, z, fill = 0, silent) {
  const g = makeRuchette(); g.position.set(x, H(x, z), z); g.rotation.y = rng() * 6.28; scene.add(g);
  const r = { x, z, y: H(x, z), fill, group: g };
  ruchettes.push(r); colliders.push({ x, z, r: 0.45 });
  stations.push({ name: 'Ruchette', kind: 'ruchette', x, z, r: 0.6, y: 0.5, ref: r });
  if (!silent) audio.place();
  return r;
}

  interact, tryPlace, bloomTile, toHex, idxOf, fps: () => fps, flowers: () => flowerMeshes.reduce((s, m) => s + m.count, 0), bees: () => beeBody.count,
  lookAt(x, y, z) { const dx = x - player.x, dz = z - player.z, dy = y - (H(player.x, player.z) + player.eye); player.yaw = Math.atan2(-dx, -dz); player.pitch = Math.atan2(dy, Math.hypot(dx, dz)); },
